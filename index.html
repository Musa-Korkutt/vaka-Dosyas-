<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sekizinci Gece · Vaka Dosyası</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
  /* Layout: dark case-room. Cover with two daily cases (Kolay, Zor), then a three-tab case view with a bottom bar. */
  :root {
    --bg: #090d10;
    --panel: #10171b;
    --panel2: #151e22;
    --line: #2b373d;
    --paper: #e5e8e7;
    --paper-ink: #1a1f21;
    --fg: #e5e8e7;
    --muted: #879298;
    --accent: #bc6953;
    --ok: #b8d8c5;
    --amber: #dfc16a;
    --display: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --hand: "Kalam", "Segoe Print", cursive;
    --body: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 var(--body);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { text-wrap: balance; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .tag { font: 700 12px/1 var(--display); letter-spacing: .16em; color: var(--muted); }
  .muted { color: var(--muted); }

  /* Cover */
  #cover { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-block: 14px; overflow-y: auto; }
  .stamp { align-self: flex-start; font: 700 13px/1 var(--display); letter-spacing: .18em; color: var(--accent); border: 2px solid var(--accent); border-radius: 3px; padding: 6px 10px; transform: rotate(-3deg); }
  #cover h1 { font: 700 clamp(30px, 9vw, 40px)/1.05 var(--display); }
  .chip { font: 700 12px/1 var(--display); letter-spacing: .06em; border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; color: var(--muted); white-space: nowrap; }
  .chip.zor { color: var(--accent); border-color: var(--accent); }
  .chip.orta { color: var(--amber); border-color: var(--amber); }
  .btn { border: 0; border-radius: 6px; padding: 14px 18px; min-height: 48px; font: 700 16px/1.1 var(--display); letter-spacing: .04em; background: var(--accent); color: #150a07; }
  .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .btn.amber { background: var(--amber); color: #171106; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; align-self: flex-start; }
  .streak { display: flex; align-items: baseline; gap: 10px; }
  .streak b { font: 700 34px/1 var(--display); color: var(--amber); font-variant-numeric: tabular-nums; }
  .cases { display: flex; flex-direction: column; gap: 12px; }
  .casecard { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .casecard .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .casecard h2 { font: 700 20px/1.15 var(--display); }
  .casecard.done { opacity: .85; }
  .mini-stars { display: flex; gap: 3px; }
  .mini-stars svg { width: 16px; height: 16px; }
  .badges { display: flex; gap: 14px; flex-wrap: wrap; }
  .badge { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 150px; }
  .badge .disc { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid var(--line); color: var(--muted); }
  .badge.on .disc { border-color: var(--amber); color: var(--amber); background: rgba(223, 193, 106, .12); }
  .badge small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
  #restoreBox { border: 1px dashed var(--amber); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: rgba(223,193,106,.05); }
  .devrow { display: flex; gap: 18px; flex-wrap: wrap; }
  .badge strong { font-weight: 600; font-size: 14px; }

  /* App shell */
  #app { flex: 1; min-height: 0; width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
  header.top { padding-right: 52px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 8px; }
  header.top h2 { font: 700 20px/1.15 var(--display); }
  header.top .lead { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pips { display: flex; gap: 6px; align-items: center; flex: none; }
  .pips span { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); }
  .pips span.used { background: transparent; border: 2px solid var(--line); }
  .pips small { font: 700 11px/1 var(--display); letter-spacing: .1em; color: var(--muted); margin-right: 4px; }
  #stage { flex: 1; min-height: 0; overflow-y: auto; padding-block: 8px 12px; display: flex; flex-direction: column; gap: 14px; }
  nav.bar { display: flex; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  nav.bar button { flex: 1; min-height: 48px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; font: 700 13px/1.1 var(--display); letter-spacing: .04em; position: relative; }
  nav.bar button[aria-selected="true"] { background: var(--panel2); border-color: var(--paper); }
  nav.bar button.accuse { background: var(--accent); border-color: var(--accent); color: #150a07; }
  .count { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--amber); }

  .file { background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .file .tag { color: #6e7a7c; }
  .file p { line-height: 1.5; }
  .plan-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  #plan { width: 100%; height: auto; display: block; max-width: 100%; }
  #plan .rl { font: 700 8.5px var(--display); letter-spacing: .14em; fill: var(--muted); }
  .hs { cursor: pointer; }
  .hs .ring { fill: rgba(188, 105, 83, .18); stroke: var(--accent); stroke-width: 1.8; }
  .hs .hit { fill: transparent; }
  .hs use { color: var(--paper); }
  .hs .pulse { fill: none; stroke: var(--accent); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
  .hs.done .ring { stroke: var(--ok); fill: rgba(184, 216, 197, .18); }
  .hs.done .pulse { display: none; }
  .hs:focus-visible .ring { stroke-width: 3.5; stroke: var(--amber); }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .hs .pulse { animation: none; opacity: .5; } }

  .clue { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
  .clue .ic { width: 40px; height: 40px; border-radius: 4px; background: var(--paper-ink); color: var(--paper); display: grid; place-items: center; }
  .clue h3 { font: 700 16px/1.2 var(--display); }
  .empty { border: 1px dashed var(--line); border-radius: 4px; padding: 20px; text-align: center; color: var(--muted); }

  .suspect { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .suspect .head { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line); font: 700 18px/1 var(--display); }
  .suspect h3 { font: 700 16px/1.2 var(--display); }
  .suspect blockquote { margin: 0; padding-left: 10px; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1 1 90px; min-height: 40px; border: 1px solid var(--line); background: transparent; border-radius: 4px; font-size: 13px; font-weight: 500; }
  .seg button[aria-pressed="true"].sus { background: rgba(188, 105, 83, .22); border-color: var(--accent); }
  .seg button[aria-pressed="true"].clr { background: rgba(184, 216, 197, .2); border-color: var(--ok); }
  .seg button[aria-pressed="true"].unk { background: var(--panel2); border-color: var(--paper); }
  .matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px; border-bottom: 1px solid var(--line); text-align: center; }
  th:first-child, td:first-child { text-align: left; min-width: 104px; }
  th { font: 700 12px/1.2 var(--display); color: var(--muted); }
  td button { width: 40px; height: 40px; border: 1px solid var(--line); background: transparent; border-radius: 4px; font-size: 16px; }
  td button[data-v="y"] { background: rgba(188, 105, 83, .22); border-color: var(--accent); }
  td button[data-v="n"] { background: rgba(184, 216, 197, .2); border-color: var(--ok); }

  /* Sheets */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(2, 4, 5, .82); display: flex; align-items: flex-end; justify-content: center; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .sheet { width: min(100%, 520px); max-height: 88%; overflow-y: auto; background: var(--panel); border-radius: 14px 14px 0 0; border-top: 1px solid var(--line); padding: 18px 16px; padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .sheet h2 { font: 700 20px/1.2 var(--display); }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .row > * { flex: 1; }
  fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  legend { font: 700 12px/1 var(--display); letter-spacing: .14em; color: var(--muted); padding: 0 0 8px; }
  .opt { display: block; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt span { display: block; border: 1px solid var(--line); border-radius: 4px; padding: 12px; min-height: 48px; }
  .opt input:checked + span { border-color: var(--accent); background: rgba(188, 105, 83, .16); }
  .opt input:focus-visible + span { outline: 2px solid var(--amber); outline-offset: 2px; }
  .opt small { display: block; color: var(--muted); }
  .stars { display: flex; gap: 6px; }
  .stars svg { width: 30px; height: 30px; }
  .verdict { font: 700 26px/1.1 var(--display); }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--accent); }
  .solution { background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 12px; }
  .newbadge { color: var(--amber); font-weight: 600; }
  .adbox { border: 1px dashed var(--amber); border-radius: 4px; min-height: 120px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 16px; }
  .adbox b { display: block; font: 700 40px/1 var(--display); color: var(--amber); margin-top: 6px; }


  /* Sekizinci Gece atmosferi */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 30;
    background: radial-gradient(ellipse at 50% 38%, rgba(0,0,0,0) 45%, rgba(0,0,0,.62) 100%),
      repeating-linear-gradient(0deg, rgba(184,216,197,.035) 0 1px, transparent 1px 3px); }
  .tag { color: #7e8f88; letter-spacing: .2em; }
  .brandline { font: 600 11px/1 var(--display); letter-spacing: .38em; color: var(--muted); text-transform: uppercase; }
  .stamp { font-family: var(--hand); font-weight: 700; font-size: 17px; letter-spacing: .08em; color: var(--accent); border-color: var(--accent); background: rgba(188,105,83,.07); opacity: .92; }
  #cover h1 { font-weight: 600; letter-spacing: .01em; text-shadow: 0 0 22px rgba(184,216,197,.14); }
  .file { background: #cfc9b4; background-image: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.08)); box-shadow: inset 0 0 40px rgba(60,45,20,.28), 0 6px 18px rgba(0,0,0,.45); }
  .file h3, .clue h3 { font-family: var(--hand); font-size: 19px; font-weight: 700; }
  .solution { background: #cfc9b4; box-shadow: inset 0 0 30px rgba(60,45,20,.25); }
  .suspect blockquote { font-family: var(--hand); font-style: normal; font-size: 16px; line-height: 1.45; }
  .streak b { text-shadow: 0 0 14px rgba(223,193,106,.35); }
  .casecard { box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  .btn { color: #150a07; }
  .btn.ghost { color: var(--fg); }
  .hs .ring { fill: rgba(188,105,83,.14); }
  .hs .pulse, .hs .ring { stroke: var(--accent); }
  .verdict.ok { color: #b8d8c5; text-shadow: 0 0 16px rgba(184,216,197,.3); }
  .verdict { font-weight: 600; }

  /* Ambient audio toggle */
  #sndBtn { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 20; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg); display: grid; place-items: center; padding: 0; }
  #sndBtn[aria-pressed="false"] { color: var(--muted); }
  #sndBtn .off { display: none; }
  #sndBtn[aria-pressed="false"] .on { display: none; }
  #sndBtn[aria-pressed="false"] .off { display: block; }
</style>

</button>

<main id="cover">
  <p class="brandline">Sekizinci Gece</p>
  <div class="stamp">GİZLİ · VAKA DOSYASI</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <p class="tag" id="todayTag">GÜNÜN VAKALARI</p>
    <h1>Gece iki dosya bıraktı</h1>
    <p class="muted">Biri açık. Diğerinin mührünü açmak için kısa bir video izle.</p>
  </div>
  <div id="restoreBox" hidden></div>
  <div class="cases" id="caseCards"></div>

  var DB = [{"day":1,"level":"Orta","title":"Kayıp Hamam Kesesi","place":"Taşkın Hamamı","rooms":["Soğukluk","Kurna salonu","Kasa odası","Kazan dairesi"],"hak":4,"mech":"alibi-saat","brief":"Taşkın Hamamı'nda sahibi Hacı Nusret, günün hasılatı olan kesesini 15:05'te kasa odasındaki sandığa koyup kapıyı yalnızca çekerek pazara gitti. 15:40'ta dönünce kese yoktu. Kurna salonundan kasa odasına gidip dönmek en az 10 dakika, kazan dairesinden ise yarım saat sürer.","suspects":[{"id":"cafer","name":"Cafer","role":"Natır","statement":"Öğleden sonra kurna salonunda müşterilerin suyunu döktüm. 15:00 ile 16:00 arasında yerimden ayrılmadım."},{"id":"remzi","name":"Remzi","role":"Tellak","statement":"15:00'den beri kurna salonundaydım, Şükrü Bey'in sırtını ovdum. Bir an bile ayrılmadım, kasa odası tarafına hiç gitmedim."},{"id":"yeter","name":"Yeter","role":"Kesemen","statement":"Soğukluk bölümünde hanım müşterilere çay verdim. 15:00'ten 15:45'e kadar yanlarından ayrılmadım."},{"id":"bekir","name":"Bekir","role":"Ateşçi","statement":"Kazan dairesinde odun besledim. 14:50'den 15:50'ye kadar ocağın başındaydım."}],"clues":[{"id":"yeterdefter","title":"Soğukluk çay defteri","room":"Soğukluk","icon":"defter","text":"Üç hanım müşteri 15:00-15:45 arası çaylarını Yeter'in elinden aldığını ve onun bir an bile yanlarından kalkmadığını imzalamış.","fx":["clear:yeter"]},{"id":"kazancizelge","title":"Kazan çizelgesi","room":"Kazan dairesi","icon":"saat","text":"Basınç çizelgesinde 14:50-15:50 arası her on dakikada bir satır var, hepsi Bekir'in imzasıyla. Kazan dairesinden gidip dönmek yarım saat sürer.","fx":["clear:bekir"]},{"id":"suyusira","title":"Su sıra kâğıdı","room":"Kurna salonu","icon":"fis","text":"15:00-16:00 arası her müşterinin suyu Cafer elinden dökmüş ve imza atmış. İki imza arası en çok beş dakika.","fx":["clear:cafer"]},{"id":"sukrunot","title":"Şükrü Bey'in notu","room":"Kurna salonu","icon":"not","text":"Müşteri Şükrü Bey kurna defterine yazmış: “Tellak 15:12'de bir dakikaya gelirim deyip çıktı, 15:34'te döndü. O arada kurnada tek başıma bekledim.”","fx":["implicate:remzi"]},{"id":"esikiz","title":"Kasa odası eşiği","room":"Kasa odası","icon":"ayakizi","text":"Kapı eşiğinde Cafer'in tahta nalın izi var. İzin üstünden, Nusret Efendi'nin 15:05'te çıkarken eşiği sildiği paspas çizgileri geçiyor.","fx":["decoy"]},{"id":"sandik","title":"Sandık","room":"Kasa odası","icon":"kutu","text":"Sandığın kilidi yok, kapak yalnızca kapalıydı. İçinde kese dışında hiçbir şeye dokunulmamış.","fx":["context"]}],"solution":"remzi","valid":["yeterdefter","kazancizelge","suyusira","sukrunot"],"explain":"Suçlu Remzi. Yeter, Bekir ve Cafer'in aralıksız kayıtları var; kasa odasına gidip dönmeleri imkânsız. Remzi ise hiç ayrılmadığını söylüyor, oysa Şükrü Bey onun 15:12-15:34 arası, yani gidip dönmeye yetecek 22 dakika yok olduğunu yazmış. Cafer'in nalın izi hırsızlıktan önceye aitti.","decoyNote":"Nalın izi 15:05'ten önceye aitti; paspas çizgileri üstünden geçiyor."},{"day":1,"level":"Zor","title":"Köprübaşı Harç Sandığı","place":"Taşköprü Başı","rooms":["Harç kulübesi","Köprü ayağı","Çay ocağı","Kervan ağılı","Çeşme başı"],"hak":5,"rule":true,"mech":"kayit-celiskisi","brief":"Taşköprü başındaki harç kulübesinde kâtip Mahir 18:30'da sandığı sayıp 80 altın buldu. 18:35'te sandığı kilitleyip mescide gitti; kulübeyi açık bıraktı, yedek anahtar çivide asılıydı. 19:10'da dönünce 20 altın eksikti. Dört kişinin ifadesi var; yalnızca biri yalan söylüyor, altını alan da o.","suspects":[{"id":"mahir","name":"Mahir","role":"Harç kâtibi","statement":"18:35'te mescide gittim, köprüden geçince on dakika sürer. Vaazı dinleyip imamla yürüyerek 19:10'da döndüm. Kulübeyi açık bırakmıştım."},{"id":"husniye","name":"Hüsniye","role":"Çaycı","statement":"Çay ocağından 18:30'dan 19:15'e kadar ayrılmadım. Kulübenin kapısı çınar tarafında, ocaktan görünmez."},{"id":"dursun","name":"Dursun","role":"Bekçi","statement":"18:00'den sonra köprü ayağında nöbetteydim, oradan ayrılmadım. Kulübeye ancak 19:10'da kâtip bağırınca yaklaştım."},{"id":"nazim","name":"Nazım","role":"Kervan başı","statement":"Kervanı 18:00'de ağıla çektim. Develeri sulayıp sayarak 19:30'a kadar ağılda kaldım."}],"clues":[{"id":"mescit","title":"Çeşme başı şahitleri","room":"Çeşme başı","icon":"goz","text":"Mescit çeşmesinde abdest alanlar ve imam, Mahir'in 18:45'te mescide girdiğini, vaazın 19:00'da bittiğini ve imamla köprüye yürüdüğünü söylüyor. Mescitten kulübeye yürüyüş on dakika.","fx":["clear:mahir"]},{"id":"fisdeste","title":"Çay fişleri","room":"Çay ocağı","icon":"fis","text":"18:30-19:15 arası 14 fiş kesilmiş, hepsi saatli ve Hüsniye'nin yazısıyla. İki fiş arası en çok dört dakika. Ocaktan kulübenin arkasına gidip dönmek sekiz dakika sürer.","fx":["clear:husniye"]},{"id":"agil","title":"Ağıl sayım levhası","room":"Kervan ağılı","icon":"kayit","text":"Develer 18:00, 18:30, 19:00 ve 19:30'da sayılmış; her satırda Nazım'ın mührü var. Ağıl köprünün öbür yakasında, kulübeye yarım saatlik yol.","fx":["clear:nazim"]},{"id":"kocan","title":"Harç koçanı","room":"Harç kulübesi","icon":"defter","text":"Koçanda 18:52'de kesilmiş bir makbuz var: “Şaban Ağa, iki at, altı kuruş.” Kâtibin kaşesi yok, altta yalnızca “D.” harfi duruyor. Şaban Ağa harcı kulübenin içinde, sandığın yanında ödediğini söylemiş.","fx":["implicate:dursun"]},{"id":"cizmeiz","title":"Kulübe eşiği","room":"Harç kulübesi","icon":"ayakizi","text":"Eşikte Nazım'ın çivili çizme izi var. İzin üstünden, 18:20'de yolu sulayan sulama arabasının tekerleği geçmiş.","fx":["decoy"]},{"id":"besaltin","title":"Ocak kasası","room":"Çay ocağı","icon":"kutu","text":"Ocak kasasında beş yeni altın var ve sabah yoktu. Ocak defterinde aynı beş altın, 17:30'da Şaban Ağa'nın toplu çay avansı olarak yazılmış.","fx":["decoy"]},{"id":"nobetdefter","title":"Nöbet defteri","room":"Köprü ayağı","icon":"dosya","text":"18:00'den 19:10'a kadar tek satır var: “Yerimdeyim, olay yok.” Satır baştan sona aynı kalemle, tek seferde ve 19:10 saatiyle yazılmış. Köprü ayağı kulübeye iki dakikalık yürüyüş.","fx":["context"]}],"solution":"dursun","valid":["mescit","fisdeste","agil","kocan"],"explain":"Suçlu Dursun. Mahir mescitte, Hüsniye fişlerin başında, Nazım ağılda sayım yapıyordu. Dursun köprü ayağından hiç ayrılmadığını söylüyor ama koçanda 18:52'de kulübede kesilmiş, “D.” imzalı bir makbuz var; nöbet defteri de tek seferde, sonradan yazılmış. Çizme izi sayımdan önceye, ocaktaki altın avansa aitti.","decoyNote":"Çizme izi 18:20'den kalma; ocaktaki altın ise Şaban Ağa'nın avansıydı."},{"day":2,"level":"Orta","title":"Köy Okulu Bağış Kutusu","place":"Çamlıdere Köy Okulu","rooms":["Öğretmen odası","Okul bahçesi","Odunluk","Yemekhane"],"hak":4,"mech":"iz-yonu","brief":"Çamlıdere Köy Okulu'nda yağmur 15:30'da dindi. Öğretmen Selma Hanım kitap parası bağış kutusunu 16:00'da öğretmen odasındaki masaya bıraktı, kömür kovasını devirdi ve sınıfa geçti. 16:40'ta döndüğünde kutu yoktu. Bahçe çamurdu.","suspects":[{"id":"veli","name":"Veli","role":"Hizmetli","statement":"15:50'de odunluğa girdim, kapı yağmurdan şişip kilitlendi. Köylüler beni 16:35'te dışarıdan çıkardı."},{"id":"cemal","name":"Cemal","role":"Çoban","statement":"Sürüyü 15:45'te dere kenarına sürdüm, 17:00'ye dek derede kaldım. Okula uğramadım."},{"id":"rifat","name":"Rıfat","role":"Muhtar","statement":"Köy odasına giderken çizmemle okul kapısına kadar geldim, Selma Hanım'a selam verip döndüm. Bahçeye girmedim."},{"id":"gulizar","name":"Gülizar","role":"Yemek ablası","statement":"16:00'dan 16:40'a kadar yemekhanede köy kadınlarıyla yağ çırptım."}],"clues":[{"id":"odunkapi","title":"Odunluk kapısı","room":"Odunluk","icon":"kapi","text":"Kapı şişmiş ve çamura gömülmüş. Kapı önündeki çamurda 16:35'e kadar hiç iz yok; sonra köylülerin izleri başlıyor ve içeriden Veli çıkıyor.","fx":["clear:veli"]},{"id":"yagdefter","title":"Yağ çırpma defteri","room":"Yemekhane","icon":"defter","text":"Üç köylü kadın, 16:00-16:40 arası Gülizar'ın bir an bile yerinden kalkmadığını imzalamış.","fx":["clear:gulizar"]},{"id":"derekapi","title":"Bahçe kapısı çamuru","room":"Okul bahçesi","icon":"ayakizi","text":"Kapı çamurunda dere yönüne giden koyun ve çarık izleri var, Cemal'in izine uyuyor; dönen iz yok. Dere okuldan yirmi beş dakika uzakta, çobanlar Cemal'i 16:00'dan 17:00'ye kadar derede, sürünün başında görmüş.","fx":["clear:cemal"]},{"id":"cizmeiz","title":"Pencere altı izleri","room":"Okul bahçesi","icon":"ayakizi","text":"Çamurda tek sıra lastik çizme izi var: bahçe kapısından öğretmen odası penceresine gidiyor. Dönüş izleri iki kat daha derin. Köyde lastik çizmeyi yalnızca muhtar giyer, diğerleri çarık giyer.","fx":["implicate:rifat"]},{"id":"komurtozu","title":"Masa üstü","room":"Öğretmen odası","icon":"kutu","text":"Kutunun yerinin yanında bir avuç kömür tozu var. Sobayı yakan Veli'nin elleri hep kömürlüdür. Kömür kovası masanın yanında devrik duruyor.","fx":["decoy"]}],"solution":"rifat","valid":["odunkapi","yagdefter","derekapi","cizmeiz"],"explain":"Suçlu Rıfat. Veli odunlukta kapana kısılmış, Gülizar şahitlerle yemekhanede, Cemal derede. Rıfat bahçeye girmediğini söylüyor ama pencereye giden lastik çizme izi var; muhtardan başka çizme giyen yok ve dönüş izleri yük taşıyan birinin ağırlığını gösteriyor. Kömür tozu, devrilen kovadan dökülmüştü.","decoyNote":"Kömür tozu, Selma Hanım'ın devirdiği kovadan dökülmüştü."},{"day":2,"level":"Zor","title":"Handa Kaybolan Bohça","place":"Kuruçeşme Hanı","rooms":["Yazıhane","Ahır","Ambar","Misafir odası"],"hak":5,"rule":true,"mech":"imkansiz-bilgi","brief":"Kuruçeşme Hanı'nda misafir Cevdet, bohçasını kapalı halde hancıya emanet etti; içini kimseye göstermedi. Ambar kilitli değildi. Bohça 21:00 ile 22:30 arasında ambardan kayboldu. Dört kişinin ifadesi var; yalnızca biri yalan söylüyor, bohçayı alan da o.","suspects":[{"id":"zeki","name":"Zeki","role":"Hancı","statement":"21:00'den 22:15'e kadar yazıhanede iki tüccarla tavla oynadım. Sonra ambara baktım, bohça yoktu."},{"id":"saziye","name":"Şaziye","role":"Aşçı","statement":"Mutfakta bulaşık yıkadım, 21:30'da yattım. Ambara hiç girmedim. Cevdet Bey'in ipek kuşaklı bohçası kaybolmuş, çok yazık."},{"id":"ahmet","name":"Ahmet","role":"Ahırcı","statement":"21:00'de nalbantı çağırdım, hasta bir katırın başında 22:30'a dek birlikte ahırdaydık."},{"id":"murat","name":"Murat","role":"Katırcı","statement":"Yatsıdan sonra odamda mektup yazdım. 21:00'den 22:30'a kadar odamdan çıkmadım."}],"clues":[{"id":"tavla","title":"Tavla skor kâğıdı","room":"Yazıhane","icon":"not","text":"Skor kâğıdında 21:00-22:15 arası iki tüccarın ve Zeki Bey'in imzası var. Yazıhane kapısı bu süre boyunca açık ve tüccarların önünde.","fx":["clear:zeki"]},{"id":"nalbant","title":"Nalbant tutanağı","room":"Ahır","icon":"kayit","text":"Nalbant Cemil'in tutanağına göre hasta katıra 21:00'den 22:30'a kadar ilaç verildi. Ahmet bu sürede katırın başından ayrılmadı.","fx":["clear:ahmet"]},{"id":"gicirti","title":"Yan oda hamalı","room":"Misafir odası","icon":"kapi","text":"Yan odadaki hamal İlyas, 21:00-22:30 arası Murat'ın kalem sesini ve öksürüğünü kesintisiz duymuş. Kapının menteşesi her açılışta gıcırdar; gece boyunca bir kez bile gıcırdamamış.","fx":["clear:murat"]},{"id":"emanetfis","title":"Emanet fişi","room":"Ambar","icon":"fis","text":"Fişte bohça “gri bez, ip bağlı” diye yazılı. Cevdet Bey ipek kuşağı bezin altına, bohçanın içine koymuş. Dışarıdan görünmüyor ve bunu kimseye söylememiş.","fx":["implicate:saziye"]},{"id":"nalcivisi","title":"Nal çivisi","room":"Ambar","icon":"alet","text":"Ambar zemininde bir nal çivisi duruyor. Ambar defterinde Ahmet'in 19:30'da buradan arpa çuvalı aldığı yazılı; çivi, çuvalın bıraktığı iz içinde yatıyor.","fx":["decoy"]},{"id":"grybez","title":"Murat'ın heybesi","room":"Misafir odası","icon":"kutu","text":"Heybede gri bez parçaları var, bohça bezine benziyor. Hanın bütün yatak örtüleri ve peşkirleri aynı gri bezdendir.","fx":["decoy"]}],"solution":"saziye","valid":["tavla","nalbant","gicirti","emanetfis"],"explain":"Suçlu Şaziye. Zeki yazıhanede, Ahmet nalbantla, Murat odasında kesintisiz görülmüş. Şaziye ambara hiç girmediğini söylüyor ama bohçanın “ipek kuşaklı” olduğunu biliyor; kuşak bezin altında gizliydi ve Cevdet kimseye söylememişti. Nal çivisi arpa çuvalından, gri bez ise hanın her yerindeki bezdendi.","decoyNote":"Çivi eski arpa çuvalından düşmüştü; gri bez hanın her yerinde var."},{"day":3,"level":"Orta","title":"Eksik Kilo Taşı","place":"Kapalı Çarşı Bedesteni","rooms":["Bedesten","Çarşı meydanı","Demirhane","Kasap dükkânı","Tartı odası"],"hak":4,"mech":"eksik-parca","brief":"Çarşı denetimi yarın. Bedestendeki Tartı odasında beş taşlık resmî takımdan damgalı 1 kiloluk taş, tartıcı Orhan'ın ikindiye çıktığı 17:05 ile 17:40 arasında kayboldu. Tartı odası bedestenin içindedir. Bedestenin tek kapısı vardır ve kapıda bekçi durur.","suspects":[{"id":"faruk","name":"Faruk","role":"Kasap","statement":"Dükkânım bedestenin içinde. 17:00'de kepenk indirip hesap yaptım, 17:45'te çıktım. Bende beş taşlık takımdan başka taş bulunmaz. Tartı odasına uğramadım."},{"id":"nilufer","name":"Nilüfer","role":"Baharatçı","statement":"Dükkânı 17:00'de kapattım ve hemen bedestenden çıkıp eve gittim."},{"id":"tahsin","name":"Tahsin","role":"Manav","statement":"Tezgâhım bedestenin dışındaki meydandadır. 17:00'den 17:50'ye kadar müşteriye baktım."},{"id":"selahattin","name":"Selahattin","role":"Demirci","statement":"Demirhanede nal dökümü yaptım. 16:45'ten 17:55'e kadar ocağın başından ayrılmadım."}],"clues":[{"id":"bekci","title":"Kapı bekçisi defteri","room":"Bedesten","icon":"defter","text":"Defterde 17:00'de Nilüfer'in çıkış yaptığı yazılı. Geri dönüşü kayıtlı değil. Tartı odasına yalnız bedestenin içinden gidilir.","fx":["clear:nilufer"]},{"id":"siradefter","title":"Manav sıra defteri","room":"Çarşı meydanı","icon":"kayit","text":"17:00-17:50 arası yirmi müşteri, hepsi Tahsin'in yazısıyla; aralarında en çok iki dakika boşluk var. Meydandan Tartı odasına gidiş dönüş on beş dakikadır.","fx":["clear:tahsin"]},{"id":"dokum","title":"Döküm çizelgesi","room":"Demirhane","icon":"saat","text":"16:45, 17:15, 17:45 satırları Selahattin'in imzasını taşıyor. Demirhane çarşıya yirmi dakika uzak; kalıp başında usta yoksa metal donar.","fx":["clear:selahattin"]},{"id":"altitas","title":"Terazi çekmecesi","room":"Kasap dükkânı","icon":"cekmece","text":"Çekmecede altı taş var, iki tanesi 1 kiloluk. Birinde resmî damga net, ötekinin damgası zımparayla kazınmış ve taş yeni cilalanmış.","fx":["implicate:faruk"]},{"id":"biber","title":"Tartı odası eşiği","room":"Tartı odası","icon":"ayakizi","text":"Eşikte kırmızı biber tozu var. Nilüfer biber satar. Tozun üstünden, eşiği 16:30'da silen paspasın çizgileri geçiyor.","fx":["decoy"]},{"id":"takim","title":"Takım kutusu","room":"Tartı odası","icon":"kutu","text":"1 kiloluk yuva boş, diğer dört taş yerinde ve damgaları tam. Kutunun kilidi yok, kapağı kırılmamış.","fx":["context"]}],"solution":"faruk","valid":["bekci","siradefter","dokum","altitas"],"explain":"Suçlu Faruk. Nilüfer 17:00'de bedestenden çıkmış, Tahsin ve Selahattin kayıtlı biçimde başka yerdeler. Faruk beş taştan başkasının olmadığını söylüyor, oysa çekmecesinde damgası kazınmış fazladan bir kilo taşı var. Eşikteki biber tozu hırsızlıktan önceki paspasın altında kalmıştı.","decoyNote":"Biber tozu 16:30 paspasından öncesine aitti."},{"day":3,"level":"Zor","title":"Medresede Eksik Yaprak","place":"Yeşilkubbe Medresesi","rooms":["Kütüphane","Ders odası","Hücre","Avlu","Mutfak"],"hak":5,"rule":true,"mech":"sahte-alibi","brief":"Yeşilkubbe Medresesi'nde Müderris Hoca'nın nadir haritalı yaprağı, kütüphane sandığından 20:00 ile 20:30 arasında kesilip alındı. Kütüphanenin kapısı açıktı. Dört kişinin ifadesi var; yalnızca biri yalan söylüyor, yaprağı alan da o.","suspects":[{"id":"nevzat","name":"Nevzat","role":"Müezzin","statement":"Akşam namazından sonra avluda 20:00'den 20:35'e kadar talebelere Kur'an dersi verdim. Kütüphaneye uğramadım."},{"id":"kerim","name":"Kerim","role":"Kâtip","statement":"20:00'den 20:40'a kadar Hoca'nın ders odasında yanında not kopyaladım."},{"id":"sadi","name":"Sadi","role":"Talebe","statement":"20:00'den 21:00'e kadar hücremde lambanın ışığında ders defterimi temize çektim; üç sayfayı bitirip Hoca'ya gösterdim."},{"id":"fikriye","name":"Fikriye","role":"Aşçı","statement":"Talebelere yemek dağıttım. 19:30'dan 20:45'e kadar mutfaktan çıkmadım."}],"clues":[{"id":"dersdefter","title":"Avlu ders defteri","room":"Avlu","icon":"defter","text":"20:00-20:35 arası on beş talebenin imzası ve Nevzat'ın imzası var. Talebeler dersin ortasında Nevzat'ın bir kez bile ayrılmadığını söylüyor.","fx":["clear:nevzat"]},{"id":"hocanot","title":"Hoca'nın notu","room":"Ders odası","icon":"not","text":"Müderris Hoca defterine yazmış: “20:00-20:40 arası Kerim yanımda oturdu, bu sürede bir kez bile kalkmadı.”","fx":["clear:kerim"]},{"id":"yemekfis","title":"Yemek fişleri","room":"Mutfak","icon":"fis","text":"19:30'dan 20:45'e kadar kırk talebeye tek tek Fikriye'nin elinden yemek dağıtılmış. Çorba kazanı ocağın başında bırakılamaz.","fx":["clear:fikriye"]},{"id":"lamba","title":"Hücrenin içi","room":"Hücre","icon":"alet","text":"Sadi'nin yağ lambası dolu, fitili yeni kesilmiş, hiç yanmamış. Pencere kuzeye bakıyor, akşam 19:30'dan sonra hücre karanlık. Masada kurumuş mürekkepli üç temiz sayfa duruyor.","fx":["implicate:sadi"]},{"id":"tespih","title":"Zemindeki tespih tanesi","room":"Kütüphane","icon":"kutu","text":"Zeminde mavi cam bir tespih tanesi bulundu. Müezzin Nevzat'ın tespihi herkesçe bilinir: sarı kehribar tanelidir.","fx":["decoy"]},{"id":"beyaztoz","title":"Sandık kapağı","room":"Kütüphane","icon":"kilit","text":"Kapakta beyaz toz var. Aşçı Fikriye un yoğurur. Ama kütüphane duvarı dün kireçlenmiş ve aynı toz duvar dibinde de yığılı.","fx":["decoy"]}],"solution":"sadi","valid":["dersdefter","hocanot","yemekfis","lamba"],"explain":"Suçlu Sadi. Nevzat avluda talebelerle, Kerim Hoca'nın yanında, Fikriye mutfakta kesintisiz görülmüş. Sadi lamba ışığında çalıştığını söylüyor ama lambası hiç yanmamış, hücre karanlıktı; sayfalar önceden hazırlanmış bir mazeretti. Mavi tespih Nevzat'ın değildi, beyaz toz kireçti.","decoyNote":"Tespih Nevzat'ın değildi; beyaz toz da duvarın kireciydi."},{"day":4,"level":"Orta","title":"Değirmende Kayıp Un","place":"Yarma Değirmeni","rooms":["Ambar","Taş katı","Avlu","Su kanalı"],"hak":4,"mech":"kokunun-izi","brief":"Yarma Değirmeni'nde iki çuval ince un 19:30 ile 21:00 arasında ambardan kayboldu. Ambar kilitli değildi ve taş katının bir üst katındadır. Taş katından ambara çıkıp inmek sekiz dakika sürer.","suspects":[{"id":"hamdi","name":"Hamdi","role":"Çırak","statement":"Taşların başında su ayarı yaptım. 19:30'dan 21:00'e kadar her beş dakikada bir çizelgeye yazdım."},{"id":"halit","name":"Halit","role":"Arabacı","statement":"Arabaya yük yükleyip 19:30'da köye çıktım, 21:10'da döndüm."},{"id":"zeliha","name":"Zeliha","role":"Un alıcı","statement":"Un almaya gelmiştim, değirmenciyi bulamayınca avluda bekledim. Ambar tarafına geçmedim, kapısına bile yaklaşmadım."},{"id":"salih","name":"Salih","role":"Su ustası","statement":"Kanal kapağının kolunu bırakırsam su taşar. 19:30'dan 21:00'e kadar kanal başında kolu elimden bırakmadım."}],"clues":[{"id":"suscizelge","title":"Su çizelgesi","room":"Taş katı","icon":"defter","text":"19:30-21:00 arası her beş dakikada bir satır var, hepsi Hamdi'nin yazısıyla. Ambara çıkıp inmek sekiz dakika sürer.","fx":["clear:hamdi"]},{"id":"kapidefter","title":"Kapı bekçisi defteri","room":"Avlu","icon":"kayit","text":"Halit'in arabası 19:30'da çıkmış, 21:10'da dönmüş. Köy yolu gidiş dönüş bir saatten fazladır ve arabanın çıkış kaydı tektir.","fx":["clear:halit"]},{"id":"cobanlar","title":"Kanal başı şahitleri","room":"Su kanalı","icon":"goz","text":"Kanal başındaki çobanlar, 19:30-21:00 arası Salih'in kolu elinden bırakmadığını ve onunla sohbet ettiğini söylüyor. Kanal değirmenden yarım saat uzak.","fx":["clear:salih"]},{"id":"lavanta","title":"Çuval yığını","room":"Ambar","icon":"goz","text":"Çuval yığınının önündeki un tozunda ve çuvalların yanında lavanta kokusu duruyor. Zeliha lavanta suyu sürer; değirmende başka kimse sürmez.","fx":["implicate:zeliha"]},{"id":"pamukip","title":"Ambardaki ip","room":"Ambar","icon":"alet","text":"Ambarda ince pamuk ip parçası bulundu. Halit yükü bağlamak için hep kalın kendir ip kullanır.","fx":["decoy"]},{"id":"cizmeizi","title":"Merdiven izi","room":"Taş katı","icon":"ayakizi","text":"Taş katı merdivenindeki çamurlu çizme izi Salih'inkine benziyor. İz merdivenin ortasında kesiliyor, ambar kapısına kadar uzanmıyor.","fx":["decoy"]}],"solution":"zeliha","valid":["suscizelge","kapidefter","cobanlar","lavanta"],"explain":"Suçlu Zeliha. Hamdi beş dakikada bir kayıt tutmuş, Halit köy yolunda, Salih kanal başında. Zeliha ambara yaklaşmadığını söylüyor ama ambarın içinde, un tozunda lavanta kokusu var ve değirmende lavanta süren yalnız o. Pamuk ip Halit'in kendir ipine uymuyor, çamur izi ambara varmıyordu.","decoyNote":"İp Halit'in kendirine, çamur izi ambar katına uymuyordu."},{"day":4,"level":"Zor","title":"Kervansarayda Sahte Ferman","place":"Sarıbel Kervansarayı","rooms":["Divan odası","Ahır","Yük deposu","Mutfak","Avlu"],"hak":5,"rule":true,"mech":"ortak-mazeret","brief":"Sarıbel Kervansarayı'nda Divan odasındaki mühür sandığından 21:00 ile 21:30 arasında boş bir geçiş fermanı alınıp mühürlendi; sahte ferman düzenlendi. Dört kişinin ifadesi var; yalnızca biri yalan söylüyor, fermanı sahteleyen de o.","suspects":[{"id":"davut","name":"Davut","role":"Kervancı","statement":"21:00'den 22:00'ye kadar Bilal Usta'yla yük deposunda yük defterini tuttuk. Birbirimizden ayrılmadık."},{"id":"bilal","name":"Bilal","role":"Yük emini","statement":"21:00'den 21:30'a kadar hasta bir devenin başındaydım. Yük defterini Davut'la 21:30'da başlatıp 22:00'ye kadar birlikte yazdık."},{"id":"rabia","name":"Rabia","role":"Aşçı","statement":"Mutfakta 20:30'dan 22:00'ye kadar yemek dağıttım, çıkmadım."},{"id":"semsi","name":"Şemsi","role":"Kâtip","statement":"20:55'te dış kapıya çıkıp gelen kervan evraklarını kontrol ettim. Divan odasına 21:35'te döndüm; mühür sandığı kapalıydı."}],"clues":[{"id":"devehekim","title":"Deve hekimi tutanağı","room":"Ahır","icon":"kayit","text":"Hasta deveye 21:00'den 21:30'a kadar ilaç verildi. Bilal yardımcı olarak yanından ayrılmadı, imzası var.","fx":["clear:bilal"]},{"id":"yemekfis","title":"Mutfak fişleri","room":"Mutfak","icon":"fis","text":"20:30-22:00 arası ardışık fişler Rabia'nın yazısıyla; aralarında üç dakikadan uzun boşluk yok. Mutfaktan Divan odasına avludan gidip dönmek altı dakikadır.","fx":["clear:rabia"]},{"id":"dissapi","title":"Dış kapı nöbetçisi","room":"Avlu","icon":"kapi","text":"Nöbetçi, Şemsi'nin 20:55'ten 21:35'e kadar kapıda evrak kontrol ettiğini söylüyor. Sıra bekleyen üç kervancı da onunla birlikteydi.","fx":["clear:semsi"]},{"id":"yukdefter","title":"Yük defteri","room":"Yük deposu","icon":"defter","text":"Defterin ilk satırı 21:30'da yazılmış; ondan önceki sayfa boş. Yük deposu Divan odasına iki dakikalık yol. Satırların hepsi aynı mürekkeple, kesintisiz yazılmış.","fx":["implicate:davut"]},{"id":"kirmizibas","title":"Çırak tanığı","room":"Divan odası","icon":"goz","text":"Çırak, 21:10'da Divan odası kapısında kırmızı başörtülü bir kadın gördüğünü söylüyor. Rabia o gün yeşil başörtü takmıştı; kırmızı başörtü yalnız misafir kadınlarda var.","fx":["decoy"]},{"id":"yemtozu","title":"Halıdaki toz","room":"Divan odası","icon":"ayakizi","text":"Halıda sarı deve yemi tozu var ve Bilal'in ahır çizmesine benziyor. Kapı nöbet defterine göre yem hamalları sabah 08:00'de bu odadan geçmiş.","fx":["decoy"]}],"solution":"davut","valid":["devehekim","yemekfis","dissapi","yukdefter"],"explain":"Suçlu Davut. Bilal hasta devenin başında, Rabia mutfakta, Şemsi dış kapıda kesintisiz görülmüş. Davut 21:00'den beri Bilal'le birlikte olduklarını söylüyor; Bilal ise birlikte yazmaya 21:30'da başladıklarını doğruluyor ve yük defterinin ilk satırı da 21:30. Davut 21:00-21:30 arası ortaklığın dışındaydı. Başörtü ve yem tozu yanıltıcıydı.","decoyNote":"Başörtü Rabia'nın değildi; yem tozu sabahtan kalmaydı."},{"day":5,"level":"Orta","title":"Saray Bahçesinde Gül Çeliği","place":"Gülbahçe Saray Bahçesi","rooms":["Gül bahçesi","Şadırvan","Köşk","Nöbetçi kulübesi","Çamaşırhane"],"hak":4,"mech":"rol-uyusmazligi","brief":"Saray bahçesinde Kırmızı Sultan gülünün altı çeliği 14:30 ile 15:30 arasında kesilip alındı. Çelikler göz üstünden eğik ve temiz kesilmiş, uçları sarılmış. Bu iş acemi eli değil, çelik kesmeyi bilen eli gösteriyor.","suspects":[{"id":"kadir","name":"Kadir","role":"Başbahçıvan","statement":"14:00'den 15:45'e kadar şadırvan tamirinde usta ve iki çırakla birlikte çalıştım."},{"id":"nuray","name":"Nuray","role":"Saray ressamı","statement":"Köşkte sulu boya yaptım, bahçeye hiç inmedim. Gül budamayı, çelik kesmeyi bilmem; ben yalnızca çizerim."},{"id":"lutfi","name":"Lütfi","role":"Nöbetçi","statement":"Kulübemde nöbet tuttum. Çan ipini her on beş dakikada bir çekip tutanağa yazdım, 14:00'ten 15:45'e kadar."},{"id":"hasibe","name":"Hasibe","role":"Çamaşırcı","statement":"Çamaşırhanede sarayın çarşaflarını 14:00'ten 16:00'ya kadar kaynattım."}],"clues":[{"id":"sadirvan","title":"Şadırvan döküm işi","room":"Şadırvan","icon":"alet","text":"Kurşun döküm 14:00-15:45 arası aralıksız sürmüş; usta ayrılırsa kalıp çatlar. İki çırak, ustanın bir an bile ayrılmadığını söylüyor.","fx":["clear:kadir"]},{"id":"cantutanak","title":"Çan tutanağı","room":"Nöbetçi kulübesi","icon":"defter","text":"14:00-15:45 arası yedi satır var, hepsi Lütfi'nin yazısıyla, aralarında en çok on beş dakika. Kulübe gül bahçesine yürüyerek yirmi dakika.","fx":["clear:lutfi"]},{"id":"kazanbasi","title":"Kazan başı yardımcıları","room":"Çamaşırhane","icon":"goz","text":"Hasibe'ye yardım eden iki kadın, 14:00-16:00 arası kazan başından ayrılmadığını söylüyor. Kazanın altı sürekli ateşlenmek zorunda.","fx":["clear:hasibe"]},{"id":"defternot","title":"Ressam defteri","room":"Köşk","icon":"not","text":"Nuray'ın defterinin kenarında el yazısıyla not var: “Gül çeliği: göz üstünden eğik kes, ucunu ıslak yosunla sar, gölgede sakla.” Notun altında geçen ayın tarihi duruyor.","fx":["implicate:nuray"]},{"id":"kesim","title":"Kesilmiş dallar","room":"Gül bahçesi","icon":"goz","text":"Çalıda altı kesik var: hepsi göz üstünden, eğik ve temiz. Kesilen uçlar ıslak yosun parçalarıyla sarılıp alınmış; yosun Köşk teras havuzunun yosununa benziyor, bahçede başka yosun yok.","fx":["context"]},{"id":"makas","title":"Çalı dibindeki makas","room":"Gül bahçesi","icon":"alet","text":"Dipte sapında “K” harfi kazılı bir bahçe makası duruyor; Kadir'in makası. Makas paslı ve yayı kopuk, açılıp kapanmıyor.","fx":["decoy"]}],"solution":"nuray","valid":["sadirvan","cantutanak","kazanbasi","defternot"],"explain":"Suçlu Nuray. Kadir şadırvanda, Lütfi tutanak başında, Hasibe kazan başında. Kesimler usta işi; Nuray ise çelik kesmeyi bilmediğini söylüyor, oysa defterinde ayrıntılı bir çelik kesme ve saklama notu var. Paslı makas çalışmıyordu, kesimde kullanılamazdı.","decoyNote":"Kadir'in makası paslı ve yaylıydı; kesimde kullanılamazdı."},{"day":5,"level":"Zor","title":"Konakta Kırık Pencere","place":"Sarıkaya Konağı","rooms":["Selamlık","Kiler","Mutfak","Bahçe","Giriş holü"],"hak":5,"rule":true,"mech":"yer-degisimi","brief":"Sarıkaya Konağı'nda Hacı Rıza 19:00'da çıkıp 20:45'te döndü. Selamlıktaki gümüş semaver kayıptı; pencere camı kırık, semaver bahçedeki gül tarhında yatıyordu. Hırsız dışarıdan girmiş gibi duruyor. Dört kişinin ifadesi var; yalnızca biri yalan söylüyor, semaveri alan da o.","suspects":[{"id":"nigar","name":"Nigâr","role":"Kahya","statement":"Hacı Rıza sayım yapılsın diye çıkarken kileri dışarıdan kilitleyip anahtarı cebine koydu. 20:45'te kapıyı o açana dek içeride sayım yaptım."},{"id":"tevfik","name":"Tevfik","role":"Aşçıbaşı","statement":"Düğün yemeği için 19:00'dan 20:45'e kadar mutfaktaydım, on iki tepsiyi ben hazırladım."},{"id":"osman","name":"Osman","role":"Bahçıvan","statement":"19:30'dan 20:30'a kadar gül tarhlarını suladım. Eve hiç girmedim. Pencerenin kırık olduğunu da görmedim."},{"id":"emre","name":"Emre","role":"Yeğen","statement":"Akşamı arkadaşlarla şehirde geçirdim. Konağa amcam geldikten sonra, 20:50'de girdim."}],"clues":[{"id":"kilerkapi","title":"Kiler kapısı","room":"Kiler","icon":"kilit","text":"Kapı 19:00'da dışarıdan kilitlenmiş, anahtar Hacı Rıza'nın cebindeymiş. Rıza 20:45'te kapıyı açınca Nigâr içeriden çıkmış; kapı önündeki tozda 19:00'dan beri iz yok.","fx":["clear:nigar"]},{"id":"tepsifis","title":"Tepsi fişleri","room":"Mutfak","icon":"fis","text":"On iki tepsinin fişlerinde 19:00-20:45 arası saat damgası var, hepsi Tevfik'in imzasıyla. Dört yardımcı, aşçıbaşı olmadan tepsi çıkmadığını söylüyor.","fx":["clear:tevfik"]},{"id":"kapici","title":"Kapıcı defteri","room":"Giriş holü","icon":"defter","text":"Emre'nin konağa girişi 20:50 olarak yazılı. O saatte Hacı Rıza çoktan dönmüş ve semaverin kayıp olduğu fark edilmişti. Duvarda başka kapı yok; 19:00-20:50 arası kapıdan kimse girmemiş.","fx":["clear:emre"]},{"id":"killicamur","title":"Selamlık eşiği","room":"Selamlık","icon":"ayakizi","text":"Kapı eşiğinden kırık pencerenin önüne kadar killi, kırmızımsı çamur izi uzanıyor. Konakta bu killi toprak yalnızca gül tarhlarında var.","fx":["implicate:osman"]},{"id":"camkirik","title":"Kırık cam","room":"Selamlık","icon":"pencere","text":"Cam parçaları odanın içinde değil, pencerenin dışında, gül tarhının üstünde. Çerçevenin kırık çıkıntıları da dışarıya doğru kıvrılmış.","fx":["context"]},{"id":"koldugmesi","title":"Tarhtaki düğme","room":"Bahçe","icon":"kutu","text":"Gül tarhında semaverin yanında Emre'nin kol düğmesi bulundu. Nigâr'ın kayıp defterinde bu düğmenin dün kaybolduğu ve Emre'nin bildirdiği yazılı.","fx":["decoy"]},{"id":"cilabezi","title":"Cila bezi","room":"Mutfak","icon":"tepsi","text":"Lavaboda gümüş cila bezi duruyor. Tevfik gümüşleri parlatır. Ama bez kuru, sert ve kirli; haftalardır kullanılmamış.","fx":["decoy"]}],"solution":"osman","valid":["kilerkapi","tepsifis","kapici","killicamur"],"explain":"Suçlu Osman. Nigâr kilerde kilitli, Tevfik mutfakta, Emre konağa sonradan girmiş. Cam dışarıya dökülmüş: pencere içeriden kırılıp hırsızlık sahnesi kurulmuş. Osman eve girmediğini söylüyor, oysa selamlığın içinde yalnızca gül tarhında bulunan killi çamur izi var. Düğme dün kaybolmuştu, cila bezi kullanılmamıştı.","decoyNote":"Düğme dün kaybolmuştu; cila bezi de haftalardır kullanılmıyordu."},{"day":6,"level":"Orta","title":"Kayıp Taç","place":"Yıldız Sahne Tiyatrosu","rooms":["Kulis","Sahne","Depo","Gişe","Işık kabini"],"hak":4,"mech":"alibi-saat","brief":"Yıldız Sahne Tiyatrosu'nda oyunun yaldızlı kral tacı depo vitrininden kayboldu. Sahne amiri tacı ara başlarken, 20:45'te yerinde saydı. Ara bitince, 21:05'te vitrin boştu. Vitrinin camı sağlam, kilidi anahtarla açılmış.","suspects":[{"id":"berna","name":"Berna","role":"Kostümcü","statement":"Ara başlamadan önce, 20:35'te eve gittim, 21:15'te döndüm. Depoya o akşam hiç girmedim."},{"id":"orhan","name":"Orhan","role":"Işıkçı","statement":"Ara boyunca ışık kabininde kaldım, ışıkları ayarladım. Depoya hiç yaklaşmadım."},{"id":"selin","name":"Selin","role":"Oyuncu","statement":"Ara boyunca sahnede, yönetmenle son sahneyi tekrar ettim."},{"id":"tuncay","name":"Tuncay","role":"Biletçi","statement":"Ara boyunca gişede bilet iadesi yaptım. Gişeden ayrılmadım."}],"clues":[{"id":"vitrin","title":"Depo vitrini","room":"Depo","icon":"kilit","text":"Vitrinin kilidi zorlanmamış, anahtarla açılmış. Cam kenarında siyah izolatör bandı lifleri duruyor. Bu bant tiyatroda yalnızca ışık kabininde kullanılıyor; kostüm, gişe ve sahne ekibi başka bant kullanıyor.","fx":["implicate:orhan"]},{"id":"kabin","title":"Işık masası","room":"Işık kabini","icon":"kayit","text":"Ara için ışık programı baştan kayıtlıydı: 20:45'te bir düğmeye basılınca ara ışığı kendiliğinden yanıyor ve 21:03'e dek ayar gerekmiyor.","fx":["context"]},{"id":"sahne","title":"Prova kronometresi","room":"Sahne","icon":"saat","text":"Yönetmenin kronometreli provası: son sahne 20:44'te başlamış, 21:06'da bitmiş. Arada Selin sahneden hiç inmemiş; yönetmen, ses teknisyeni ve iki oyuncu sahne kenarından izlemiş.","fx":["clear:selin"]},{"id":"iade","title":"Bilet iade fişleri","room":"Gişe","icon":"fis","text":"İade fişleri 20:46, 20:50, 20:54, 20:58 ve 21:02'de basılmış, hepsinde Tuncay'ın kaşesi var. Gişeden depoya tek yön yürüyüş 6 dakika sürüyor.","fx":["clear:tuncay"]},{"id":"cikis","title":"Personel çıkış defteri","room":"Gişe","icon":"defter","text":"Berna 20:35'te çıkış, 21:15'te giriş yazmış. Kapıdaki güvenlik görevlisi ikisini de kendi eliyle işlemiş.","fx":["clear:berna"]},{"id":"folyo","title":"Tuncay'ın ceketi","room":"Kulis","icon":"kutu","text":"Kulis askısındaki Tuncay'ın ceketinde altın renkli bir folyo parçası var. Parça tacın kaplamasına benziyor ama üstünde 'Gala Draje' yazısının yarısı okunuyor: gişede satılan çikolatanın sarmalı.","fx":["decoy"]}],"solution":"orhan","valid":["vitrin","sahne","iade","cikis"],"explain":"Suçlu Orhan. Berna 20:35'ten 21:15'e dek tiyatroda değildi, Selin sahnede kronometreyle izlendi, Tuncay'ın iade fişleri depoya gidip gelmesine izin vermiyor. Orhan 'depoya yaklaşmadım' dedi ama vitrinde yalnızca ışık kabininde kullanılan bant lifleri çıktı. Ara ışığı kendiliğinden yandığı için kabinde kalması gerekmiyordu. Folyo çikolata sarmalıydı.","decoyNote":"Folyo çikolata sarmalıydı, taç kaplaması değil."},{"day":6,"level":"Zor","title":"Mühürlü Koli","place":"Hilal Matbaası","rooms":["Baskı salonu","Mürettiphane","Ciltleme","Ofis","Depo","Giriş"],"hak":5,"rule":true,"mech":"kayit-celiskisi","brief":"Hilal Matbaası'nda müşteri Tolga Bey'in davetiye kolisi 20:50'de onun gözü önünde mühürlenip depoya kondu. 21:45'te mühür yeniden yapıştırılmış, içinden 40 davetiye eksik çıktı. Dört çalışanın ifadesi var ve yalnızca biri yalan söylüyor: koliyi açan da o.","suspects":[{"id":"fikret","name":"Fikret","role":"Cilt ustası","statement":"Servise yetişmek için 20:40'ta matbaadan çıktım. Koliyi hiç görmedim."},{"id":"cemal","name":"Cemal","role":"Baskı ustası","statement":"Akşam boyunca baskı makinesinin başındaydım. Depoya uğramadım."},{"id":"dilek","name":"Dilek","role":"Mürettip","statement":"20:55'te mesaiyi bitirip çıkış defterine yazdım ve eve gittim. Depoya hiç girmedim."},{"id":"gonca","name":"Gonca","role":"Muhasebeci","statement":"Mühürden sonra Tolga Bey'le ofiste hesap görüştük. Yanımdan ayrılmadı, ben 21:52'de çıktım."}],"clues":[{"id":"sayac","title":"Makine sayacı","room":"Baskı salonu","icon":"alet","text":"Baskı makinesinin sayacı 20:50'den 21:45'e dek kesintisiz ilerlemiş. Makine tek kişiyle çalışır: başındaki usta ayrılırsa güvenlik düzeneği makineyi durdurur ve sayaç da durur.","fx":["clear:cemal"]},{"id":"defter","title":"Çıkış defteri","room":"Mürettiphane","icon":"defter","text":"Kapı yanındaki çıkış defterinde Fikret 20:40, Dilek 20:55 çıkış yazmış. Defteri herkes kendi eliyle doldurur; saatler kimse tarafından denetlenmez.","fx":["context"]},{"id":"servis","title":"Servis çizelgesi","room":"Ciltleme","icon":"harita","text":"Servis çizelgesinde Fikret 20:40 servisine binmiş, şoförün imzası var. Servis güzergâhı bitince Fikret'i evine bırakmış, matbaaya dönmemiş.","fx":["clear:fikret"]},{"id":"tutanak","title":"Hesap tutanağı","room":"Ofis","icon":"dosya","text":"Gonca ile Tolga Bey'in hesap görüşmesi 20:52'de başlamış, 21:45'te bitmiş. Tolga Bey her sayfayı imzalamış ve görüşme boyunca Gonca'nın yanından ayrılmamış.","fx":["clear:gonca"]},{"id":"numune","title":"Gonca'nın çekmecesi","room":"Ofis","icon":"cekmece","text":"Gonca'nın çekmecesinde 40 adet gala davetiyesi var. Hepsinin köşesinde kırmızı 'ÖRNEKTİR' damgası duruyor; Tolga Bey'in kolisindeki asıl davetiyeler damgasızdır.","fx":["decoy"]},{"id":"leke","title":"Koli kenarı","room":"Depo","icon":"kutu","text":"Kolinin kenarında mavi mürekkep lekesi var ve baskı salonunda o gün yalnızca mavi mürekkep kullanıldı. Leke yeniden yapıştırılan bandın değil, ilk mühür bandının altında kalmış ve kurumuş: koli mühürlenmeden önce bulaşmış.","fx":["decoy"]},{"id":"okuyucu","title":"Kart okuyucu raporu","room":"Giriş","icon":"kayit","text":"Personel kapısı kart okuyucusu 20:30'dan 22:00'ye kadar hiç giriş kaydetmemiş, yalnızca iki çıkış yazmış: 20:40 Fikret, 21:52 Gonca. Kapıdan kartsız çıkılmaz. Yangın kapısı mühürlü, mühür yerinde.","fx":["implicate:dilek"]}],"solution":"dilek","valid":["sayac","servis","tutanak","okuyucu"],"explain":"Suçlu Dilek. Cemal'in makinesi kesintisiz çalıştı, Fikret 20:40'ta servisle gitti, Gonca Tolga Bey'le birlikteydi. Dilek 20:55'te çıktığını söyledi ve defterde yazılı, ama kart okuyucu o saatte çıkış kaydetmemiş: defter satırı kontrolsüz yazılmış. Dilek binadan hiç çıkmamıştı. Numune davetiyeler ve mavi leke yanıltıcıydı.","decoyNote":"Numuneler damgalıydı, leke de mühürden önce bulaşmıştı."},{"day":7,"level":"Orta","title":"Unlu İzler","place":"Taşkın Fırını","rooms":["Hamur odası","Fırın ocağı","Dükkân","Un deposu","Arka bahçe"],"hak":4,"mech":"iz-yonu","brief":"Taşkın Fırını'nın usta tarif defteri 04:40'ta hamur odasındaki rafında duruyordu. 05:30'da yerinde yoktu. Hamur odasının zemini unla kaplı; arka kapı sabah kapalıydı ama kilitli değildi.","suspects":[{"id":"kemal","name":"Kemal","role":"Un nakliyecisi","statement":"Un çuvallarını 04:30'da dükkânın ön kapısına bıraktım ve gittim. Arka tarafa hiç geçmedim."},{"id":"ramazan","name":"Ramazan","role":"Fırın ustası","statement":"04:40'ta defterin yerinde olduğunu gördüm, sonra ocağın başına döndüm ve ayrılmadım."},{"id":"sevgi","name":"Sevgi","role":"Tezgâhtar","statement":"Dükkânı 05:02'de açtım. Ondan önce evdeydim."},{"id":"hatice","name":"Hatice","role":"Çırak","statement":"04:35'te un almak için depoya girdim, kapı kapanıp takılı kaldı. 05:25'e dek içerde kaldım."}],"clues":[{"id":"hamur","title":"Hamur odası zemini","room":"Hamur odası","icon":"ayakizi","text":"Unlu zeminde rafın önünde Ramazan'ın terlik izi var. Terlik izinin üstüne sonradan basılmış ağır bir çizme izi görülüyor; çizme izi raftan arka kapıya doğru gidiyor.","fx":["decoy"]},{"id":"bahce","title":"Arka bahçe","room":"Arka bahçe","icon":"ayakizi","text":"Çizme izleri arka kapıdan çıkıp bahçeden kamyonet park yerine uzanıyor ve orada bitiyor. Taban deseni nakliyeci Kemal'in ağır iş çizmesiyle aynı; fırın ekibinde çizme giyen yok. Un kamyoneti her gece 04:30'da bu yere yanaşır. Dükkânın ön kapısına giden bir iz yok.","fx":["implicate:kemal"]},{"id":"ocak","title":"Ocak kartı","room":"Fırın ocağı","icon":"saat","text":"Ocak kartında 04:45'ten 05:30'a dek her 3 dakikada bir 'çevirdim' parafı var, hepsi Ramazan'ın. Ocaktan hamur odasına gidip gelmek 8 dakika sürüyor.","fx":["clear:ramazan"]},{"id":"alarm","title":"Kasa fişleri ve otobüs kartı","room":"Dükkân","icon":"fis","text":"Sevgi'nin otobüs kartı 04:51'de binmiş, 05:00'de dükkân durağında inmiş görünüyor. Kasa fişleri 05:02'den 05:30'a dek her 3-4 dakikada bir çıkmış, hepsinde onun kodu var.","fx":["clear:sevgi"]},{"id":"sursu","title":"Depo sürgüsü","room":"Un deposu","icon":"kilit","text":"Depo kapısının dış sürgüsü kapanmış. Sürgü, kapıya dayalı un çuvalının kaymasıyla kendiliğinden geçmiş; yerde çuval sürüklenme izi var. İçeriden açılamıyor. Fırın sahibi Taşkın Bey sürgüyü 05:25'te çekmiş.","fx":["clear:hatice"]}],"solution":"kemal","valid":["bahce","ocak","alarm","sursu"],"explain":"Suçlu Kemal. Ramazan ocaktan ayrılamazdı, Sevgi 05:00'e dek yoktu, Hatice sürgülü depoda kalmıştı. Çizme izleri arka kapıdan kamyonet yerine gidiyor; Kemal ise arkaya hiç geçmediğini söyledi. Ramazan'ın terlik izi çizme izinin altında kalmıştı: o, 04:40'taki kontrolünden kalma, hırsız ondan sonra gelmişti.","decoyNote":"Terlik izi çizme izinin altında kalmış, daha eski."},{"day":7,"level":"Zor","title":"Yanlış Numara","place":"Çarşı Postası Gazete Binası","rooms":["Haber odası","Dizgi odası","İlan servisi","Arşiv"],"hak":5,"rule":true,"mech":"imkansiz-bilgi","brief":"Çarşı Postası'nın yarınki ilan sayfasında bir ilanın telefon numarası, 23:10 ile 23:30 arasında dizgi bilgisayarında değiştirildi. Hata 23:55'te fark edildi; ekibe yalnızca 'bir ilanda numara değişmiş' denildi. İfadeler 23:58'de, ilanın hangisi olduğu belli olmadan alındı. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: numarayı değiştiren de o.","suspects":[{"id":"vedat","name":"Vedat","role":"Muhabir","statement":"22:50'de belediye toplantısına gittim, 23:40'ta döndüm. Dönünce ilan numarası meselesini duydum."},{"id":"aylin","name":"Aylin","role":"İlan servisi memuru","statement":"Gece boyunca ilan servisinde müşterileri arayıp ilanları onaylattım. Dizgiye gitmedim."},{"id":"ferhat","name":"Ferhat","role":"Grafiker","statement":"Akşam arşivde eski fotoğrafları taradım. Dizgi odasına uğramadım."},{"id":"zeynep","name":"Zeynep","role":"Gece sekreteri","statement":"Telefonlara baktım, dizgi odasına hiç girmedim. Kuru temizlemecinin ilanındaki numarayı değiştirmişler ama sayfaya yaklaşmadım bile."}],"clues":[{"id":"toplanti","title":"Toplantı tutanağı","room":"Haber odası","icon":"dosya","text":"Belediye toplantısı katılım tutanağı Vedat'ın imzasını 23:05 ve 23:35'te taşıyor. Toplantı salonu gazeteden araçla 25 dakika uzaklıkta.","fx":["clear:vedat"]},{"id":"kupur","title":"Vedat'ın masası","room":"Haber odası","icon":"not","text":"Vedat'ın masasında kuru temizlemecinin ilanından kesilmiş bir kupür var. Kupürün üstündeki tarih dünkü sayıya ait; ilan dün de yayımlanmış.","fx":["decoy"]},{"id":"duyuru","title":"Editör duyurusu","room":"Dizgi odası","icon":"not","text":"Sayfa editörünün 23:55 duyurusu: 'Bir ilanda numara değişmiş, hangisi olduğunu henüz bilmiyorum.' Hangi ilan olduğu 00:05'te yalnızca editöre ve ilan servisine bildirilmiş; ne yazılı ne sözlü başka kimseye söylenmemiş. Düzeltme 00:10'da yapılmış
