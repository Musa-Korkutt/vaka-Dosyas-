 sonra dükkânımdan çıkmadım."},{"id":"yusuf","name":"Yusuf","role":"Temizlikçi","statement":"Arka kapı anahtarını 18:30'da panoya astım. Sonra çöpü çıkarıp eve gittim."},{"id":"nalan","name":"Nalan","role":"Müşteri","statement":"Tamir ettirdiğim saati alıp 19:30'da çıktım. Arka kapıdan haberim yok."}],"clues":[{"id":"pano","title":"Anahtar panosu","room":"Arka oda","icon":"anahtar","text":"Panoda arka kapı kancası boş. Teslim defteri: 18:00'de 'arka kapı anahtarı - Yusuf aldı', iade sütunu boş. Başka satır yok.","fx":["implicate:yusuf"]},{"id":"fis","title":"Kasa fişi","room":"Vitrin salonu","icon":"fis","text":"Nalan Hanım'ın tamir ödemesi 19:25'te yapılmış, saatin teslim imzası 19:28'de atılmış. Fişe otogar bileti iliştirilmiş: Nalan Hanım 19:45 otobüsüne binmiş, otobüs 21:30'a dek durmadan şehirlerarası yolda.","fx":["clear:nalan"]},{"id":"emir","title":"İş emri defteri","room":"Atölye","icon":"defter","text":"19:30'dan 21:00'e dek her iş emri Tarık'ın elinden çıkmış; her birine Ferit Usta aynı masada onay parafı atmış. Usta bu iki saat boyunca atölyeden ayrılmamış; 20:00 sayımında vitrin salonundaki masa saatini cam bölmeden görüp yerinde diye deftere yazmış.","fx":["clear:tarik"]},{"id":"onluk","title":"Tarık'ın önlüğü","room":"Atölye","icon":"kutu","text":"Atölye kapısındaki askıda Tarık'ın önlüğü var. Cebinde bir anahtar duruyor ama anahtarın üstündeki etikette 'Ön kapı' yazıyor.","fx":["decoy"]},{"id":"kamera","title":"Karşı kaldırım kamerası","room":"Sokak","icon":"kamera","text":"Meral Hanım 19:50'den 21:10'a dek kendi vitrininde çalışırken görünüyor. Dükkânının tek kapısı sokağa açılıyor ve o saatlerde hiç açılmamış.","fx":["clear:meral"]}],"solution":"yusuf","valid":["pano","fis","emir","kamera"],"explain":"Suçlu Yusuf. Nalan 19:28'de gitmişti, Tarık usta gözü önünde çalışıyordu, Meral kamerada kendi vitrinindeydi. Yusuf anahtarı panoya astığını söyledi ama defterde iade yok ve kanca boş. Tarık'ın önlüğündeki anahtar ön kapıya aitti.","decoyNote":"Önlükteki anahtar ön kapınındı, arka kapınınki değil."},{"day":8,"level":"Zor","title":"Üçüncü Kat Formu","place":"Lale Palas Oteli","rooms":["Resepsiyon","Kasa odası","3. kat koridoru","5. kat","Bar"],"hak":5,"rule":true,"mech":"sahte-alibi","brief":"Lale Palas Oteli'nin kasa odasından misafir Bay Orhun'un mühürlü zarfı 02:00 ile 02:20 arasında alındı. Kasa kilitliydi ve anahtarla açılmış. Dört gece çalışanının ifadesi var ve yalnızca biri yalan söylüyor: zarfı alan da o.","suspects":[{"id":"mert","name":"Mert","role":"Bellboy","statement":"Beşinci kattaki 512 numaralı odada musluk tamirine yardım ettim. 02:00 ile 02:25 arasında oradaydım."},{"id":"ayten","name":"Ayten","role":"Kat görevlisi","statement":"02:00 ile 02:20 arasında üçüncü kattaki odaları temizledim. Kat formuna saatlerini yazdım."},{"id":"selcuk","name":"Selçuk","role":"Resepsiyoncu","statement":"Geç gelen misafirin kaydını yaptım. 02:00 ile 02:20 arasında masadan hiç kalkmadım."},{"id":"doruk","name":"Doruk","role":"Barmen","statement":"Bar kapanışında son müşterilere servis yaptım. Tezgâhtan ayrılmadım."}],"clues":[{"id":"kayit","title":"Geç misafir kaydı","room":"Resepsiyon","icon":"defter","text":"Geç gelen Bay Ender'in kayıt formu, kimliği ve depozito makbuzu 02:02, 02:09 ve 02:18'de imzalanmış. Resepsiyondan kasa odasına gidip gelmek 14 dakika sürüyor. Bay Ender hepsini Selçuk'un masasında, karşısında imzaladığını yazmış.","fx":["clear:selcuk"]},{"id":"bar","title":"Bar kasası","room":"Bar","icon":"fis","text":"Bar kasası fişleri 01:56'dan 02:24'e dek her 2 dakikada bir çıkmış, hepsi Doruk'un kodu. Barda başka çalışan yok. Bardan kasa odasına gidip gelmek 16 dakika sürüyor.","fx":["clear:doruk"]},{"id":"zarf","title":"Doruk'un önlüğü","room":"Bar","icon":"kutu","text":"Doruk'un önlük cebinde boş bir zarf var. Üstünde 'Oda 207 hesabı' yazıyor. Çalınan zarf mühürlüdür ve üstünde 'Orhun' yazılıdır.","fx":["decoy"]},{"id":"musluk","title":"512 numaralı oda","room":"5. kat","icon":"not","text":"Misafir Bayan Ceren'in şikâyet notu: 'Bellboy Mert 02:00'den 02:25'e dek musluğu tamir etti, ben de yanında bekledim.'","fx":["clear:mert"]},{"id":"form","title":"Kat formu","room":"3. kat koridoru","icon":"dosya","text":"Kat formu: 312 - 02:00, 314 - 02:07, 316 - 02:14, hepsi Ayten parafı. Ama bu odaların kapı askısında 'Rahatsız etmeyin' var ve kapı kilidi kayıtlarında 02:00-02:20 arası hiç giriş görünmüyor.","fx":["implicate:ayten"]},{"id":"iz","title":"Kasa kapağı","room":"Kasa odası","icon":"kilit","text":"Kasa kapağında Selçuk'un parmak izi var. Kasayı her gece 23:00'te Selçuk kapatıyor. İzler yalnızca kapak yüzünde; kilit çevresindeki metal silinmiş.","fx":["decoy"]}],"solution":"ayten","valid":["kayit","bar","musluk","form"],"explain":"Suçlu Ayten. Selçuk misafirin karşısındaydı, Doruk barda 2 dakikada bir fiş kesti, Mert 512'de misafirle birlikteydi. Ayten üçüncü katta temizlik yaptığını söyledi, formda saatler yazılı; ama o odalarda 'Rahatsız etmeyin' asılıydı ve kapı kayıtlarında giriş yok. Form önceden doldurulmuştu. Selçuk'un izi her gece kapatmasından, zarf da başka misafirindi.","decoyNote":"İz her gece kapatmadan kalma; zarf başka odanın hesabıydı."},{"day":9,"level":"Orta","title":"Fazla Mühür","place":"Kordon Noterliği","rooms":["Kâtip odası","Noter odası","Bekleme salonu","Üst kat","Sokak"],"hak":4,"mech":"sistem-kaydi","brief":"Kordon Noterliği'nde kapanıştan sonra, 20:36 ile 20:50 arasında sahte bir vekâletname mühürlendi. Mühür sayacı akşam 412'ydi, sabah 413. Noter Elif Hanım o saatte büroda değildi.","suspects":[{"id":"esra","name":"Esra","role":"Sekreter","statement":"20:18'de servise binip eve gittim, 20:58'de indim. Büroya dönmedim."},{"id":"taner","name":"Taner","role":"Müşteri","statement":"Randevum 20:20'de bitti, çıkıp karşıdaki muhtarlıkta sıraya girdim."},{"id":"gulay","name":"Gülay","role":"Temizlikçi","statement":"20:00 ile 21:00 arasında üst kattaki ofislerin temizliğini yaptım."},{"id":"murat","name":"Murat","role":"Kâtip","statement":"19:30'da bilgisayarımı kapatıp çıktım. Gece mührüne dokunmadım."}],"clues":[{"id":"gunluk","title":"Kâtip bilgisayarı","room":"Kâtip odası","icon":"kayit","text":"Bilgisayar günlüğü: 19:30'da kapatma komutu verilmemiş. 20:36'da elle uyandırılmış, 20:38'de 'vekâlet şablonu' açılmış, 20:46'da yazdırma komutu verilmiş. Oturum kilitli değildi.","fx":["implicate:murat"]},{"id":"sayac","title":"Mühür sayacı","room":"Noter odası","icon":"saat","text":"Sayaç kapanışta 412, sabah 413: gece yalnızca bir mühür basılmış. Mühür çekmecesi kilitli bulunmuş; yedek anahtar odadaki açık çekmecede duruyor, herkes ulaşabilir.","fx":["context"]},{"id":"masa","title":"Mühür masası","room":"Noter odası","icon":"cekmece","text":"Mühür masasında silme izleri ve temizlik bezi lifleri var. Temizlik çizelgesine göre masayı Gülay 18:15'te silmiş; taze mühür mürekkebi lekesi ise silme izlerinin üstünde duruyor.","fx":["decoy"]},{"id":"kamera","title":"Giriş kamerası","room":"Bekleme salonu","icon":"kamera","text":"Taner 20:21'de çıkıyor ve tekrar girmiyor. Sokak kamerasında 20:27'de karşıdaki muhtarlığa giriyor, 21:05'te çıkıyor.","fx":["clear:taner"]},{"id":"servis","title":"Servis kart okuyucusu","room":"Sokak","icon":"arac","text":"Servis aracının kart okuyucusu: Esra 20:18'de binmiş, 20:58'de inmiş. Araç aradaki sürede durak dışında hiç durmamış.","fx":["clear:esra"]},{"id":"kat","title":"Temizlik kartı","room":"Üst kat","icon":"kayit","text":"Üst kat temizlik kartı 20:02'den 20:58'e dek her 8 dakikada bir okutulmuş, hepsi Gülay'ın kartı. Üst kattan noter odasına dış merdivenle inmek 7 dakika sürüyor.","fx":["clear:gulay"]}],"solution":"murat","valid":["gunluk","kamera","servis","kat"],"explain":"Suçlu Murat. Esra serviste, Taner muhtarlıkta, Gülay üst katta kartını okutuyordu. Murat bilgisayarını 19:30'da kapattığını söyledi ama günlükte kapatma yok; 20:36'da elle uyandırılıp vekâlet şablonu açılmış. Mühür masasının silme izleri 18:15'ten kalmaydı, mürekkep lekesi onların üstündeydi.","decoyNote":"Masa 18:15'te silinmişti, mürekkep sonradan sürülmüş."},{"day":9,"level":"Zor","title":"Krema Lekesi","place":"Gül Pastanesi","rooms":["Mutfak","Şef odası","Vitrin salonu","Yükleme rampası","Depo"],"hak":5,"rule":true,"mech":"ortak-mazeret","brief":"Gül Pastanesi'nde Şef Gül Hanım'ın gelin pastası tarif kartı, 21:00 ile 21:40 arasında şef odasındaki dolaptan alındı. Dolap kilitli bırakılmıştı. Dört çalışanın ifadesi var ve yalnızca biri yalan söylüyor: kartı alan da o.","suspects":[{"id":"berkay","name":"Berkay","role":"Pasta ustası","statement":"21:00 ile 21:40 arasında gelin pastasını Aslı'yla aynı tezgâhta hazırladık. Tezgâhtan hiç ayrılmadım, şef odasına girmedim."},{"id":"asli","name":"Aslı","role":"Çırak","statement":"21:00'den beri fırının ve tezgâhın başındayım. Berkay Usta 21:15'te krema getirmeye gitti, 21:35'te döndü."},{"id":"cengiz","name":"Cengiz","role":"Kasiyer","statement":"Vitrin salonunda kasadaydım. 21:00 ile 21:40 arasında müşterilere baktım."},{"id":"ruya","name":"Rüya","role":"Kurye","statement":"20:50'de siparişleri dağıtmaya çıktım, 21:50'de döndüm."}],"clues":[{"id":"zaman","title":"Fırın zamanlayıcı kartı","room":"Mutfak","icon":"saat","text":"21:00'den 21:40'a dek her 4 dakikada bir tepsi çevrilmiş, hepsi Aslı'nın paraflı. Mutfaktan şef odasına gidip gelmek 8 dakika sürüyor.","fx":["clear:asli"]},{"id":"krema","title":"Dolap kolu","room":"Şef odası","icon":"kilit","text":"Dolabın koluna sürülmüş vanilyalı krema lekesi var, kilit anahtarla açılmış. O gece krema yalnızca iki yerde açıldı: pasta ustasının tezgâhında ve vitrinin soğutucusunda.","fx":["implicate:berkay"]},{"id":"kasa","title":"Kasa fişleri","room":"Vitrin salonu","icon":"fis","text":"21:00'den 21:40'a dek her 3-4 dakikada bir fiş çıkmış, hepsi Cengiz'in kodu. Kasadan şef odasına mutfaktan geçilerek gidiliyor; gidiş-dönüş 10 dakika.","fx":["clear:cengiz"]},{"id":"menu","title":"Kasadaki fotokopi","room":"Vitrin salonu","icon":"dosya","text":"Cengiz'in kasasında 'tarif kartı' diye ayrılmış bir fotokopi var. Fotokopi, müşterilere verilen düğün pastası fiyat listesi; ne tarif ne malzeme yazıyor.","fx":["decoy"]},{"id":"takograf","title":"Takograf kaydı","room":"Yükleme rampası","icon":"arac","text":"Teslimat aracı 20:50'de rampadan çıkmış, 21:50'de dönmüş. Arada pastane çevresine hiç girmemiş.","fx":["clear:ruya"]},{"id":"ayak","title":"Depo zemini","room":"Depo","icon":"ayakizi","text":"Un çuvallarının arasında Rüya'nın botlarının modelinde izler var. İzler kalın ve kuru bir toz tabakasının altında kalmış, günler önceden kalma.","fx":["decoy"]}],"solution":"berkay","valid":["zaman","krema","kasa","takograf"],"explain":"Suçlu Berkay. Aslı zamanlayıcı kartıyla, Cengiz fişlerle, Rüya takografla kanıtlı. Berkay ile Aslı'nın ifadeleri çelişiyor: Aslı kartıyla doğru söylüyor, demek ki Berkay 21:15-21:35 arası tezgâhta değildi. Dolap kolundaki krema onun tezgâhından geliyor. Fotokopi fiyat listesiydi, bot izleri günlerce eskiydi.","decoyNote":"Fotokopi fiyat listesiydi, bot izi eski tozun altındaydı."},{"day":10,"level":"Orta","title":"Sedir Kokusu","place":"Hızır Usta Berber Salonu","rooms":["Salon","Arka oda","Çay ocağı","Giriş"],"hak":4,"mech":"kokunun-izi","brief":"Berber Hızır Usta'nın nadir sedir yağı şişesi 19:15'te arka odadaki rafta doluydu. 19:50'de şişenin yarısı boşalmıştı ve oda keskin sedir kokuyordu.","suspects":[{"id":"ismail","name":"İsmail","role":"Kalfa","statement":"18:30'dan beri koltuk başındaydım, altı müşteri aldım. Arka odaya girmedim."},{"id":"baris","name":"Barış","role":"Çırak","statement":"Akşam tezgâhı süpürdüm, aynaları sildim. Sedir yağına hiç dokunmadım, kokusuna bile yaklaşmadım."},{"id":"nuri","name":"Nuri","role":"Müşteri","statement":"19:10'da Hızır Usta'nın koltuğuna oturdum, 19:55'e kadar kalktığımı hatırlamıyorum."},{"id":"ziya","name":"Ziya","role":"Çaycı","statement":"Çay ocağından çıkmadım, durmadan çay demledim ve servis ettim."}],"clues":[{"id":"sise","title":"Sedir yağı şişesi","room":"Arka oda","icon":"kutu","text":"Şişe rafta, kapağı gevşek ve dibinde yarım parmak yağ kalmış. Rafın tozunda şişenin izinden başka iz yok. Oda 19:50'de hâlâ keskin sedir kokuyor, yağ yeni dökülmüş.","fx":["context"]},{"id":"onluk","title":"Önlük askısı","room":"Giriş","icon":"kapi","text":"Giriş askısındaki üç önlükten yalnızca çırağın önlüğü keskin sedir kokuyor ve kolunda yağlı bir leke var. Kalfanın ve ustanın önlükleri sabunlu temiz kokuyor.","fx":["implicate:baris"]},{"id":"randevu","title":"Randevu defteri","room":"Salon","icon":"defter","text":"İsmail 18:30'dan 20:00'ye dek altı müşteri almış, her biri kendi koltuğunda imza atmış. Müşteriler arasında 2 dakika var. Salondan arka odaya gidip gelmek 6 dakika sürüyor.","fx":["clear:ismail"]},{"id":"hizir","title":"Hızır Usta'nın notu","room":"Salon","icon":"not","text":"Nuri Bey 19:10'da koltuğa oturdu, sıcak havlu ve masajla 19:55'te kalktı. Bu sürede gözleri kapalı, yüzü havluya sarılı ve ustanın elleri altındaydı.","fx":["clear:nuri"]},{"id":"karanfil","title":"Nuri Bey'in ceketi","room":"Salon","icon":"kutu","text":"Ceketin cebinde yağ lekesi ve küçük bir şişe var; etiket 'karanfil yağı - diş ağrısı'. Koku sedirin odunsu kokusuna değil, keskin baharat kokusuna benziyor.","fx":["decoy"]},{"id":"bardak","title":"Bardak sayacı","room":"Çay ocağı","icon":"tepsi","text":"Çay ocağının sayacı 19:12'den 19:52'ye dek her 2 dakikada bir servis yazmış. Semaverin başında başka kimse yok. Çay ocağından arka odaya gidip gelmek 12 dakika sürüyor.","fx":["clear:ziya"]}],"solution":"baris","valid":["onluk","randevu","hizir","bardak"],"explain":"Suçlu Barış. İsmail müşterilerle, Nuri Bey ustanın elleri altında, Ziya semaverin başındaydı. Üç önlükten yalnızca çırağınki sedir kokuyor ve yağlı; Barış ise kokusuna bile yaklaşmadığını söyledi. Nuri Bey'in cebindeki şişe karanfil yağıydı, kokusu da farklıydı.","decoyNote":"Cepteki şişe karanfil yağıydı, kokusu sedirden farklı."},{"day":10,"level":"Zor","title":"Damgalı Gümüş","place":"Yeşil Kapı Antikacılık","rooms":["Atölye","Sergi salonu","Kasa","Sokak"],"hak":5,"rule":true,"mech":"rol-uyusmazligi","brief":"Yeşil Kapı Antikacılık'ta damgasız duran gümüş çay takımına, 17:30 ile 18:05 arasında sahte bir '925' ayar damgası vuruldu; takım damgayla on kat pahalı satılacaktı. Damga 18:05'te görüldü. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: damgayı vuran da o.","suspects":[{"id":"meryem","name":"Meryem","role":"Gümüş ustası","statement":"17:30'dan 18:10'a dek sergi salonunda Haldun Bey'in kaşıklarının ayar testini yaptım. Salondan çıkmadım."},{"id":"okan","name":"Okan","role":"Tezgâhtar","statement":"Kasada müşterilere baktım, 17:32'den 18:04'e dek kasa başından ayrılmadım."},{"id":"pinar","name":"Pınar","role":"Çerçeveci","statement":"17:20'de çerçeveleri teslim etmeye çıktım, 18:20'de döndüm."},{"id":"nusret","name":"Nusret","role":"Marangoz","statement":"Gümüş takıma hiç yaklaşmadım. Akşam sandık menteşelerini yağladım, benim işim marangozluk."}],"clues":[{"id":"damga","title":"Sahte damga","room":"Atölye","icon":"alet","text":"Takımdaki sahte damga metal çekiçle değil, tahta bir tokmakla vurulmuş. Damganın çevresinde ahşap lifleri ve ince zımpara tozu var. Atölyede tahta tokmak ve zımpara yalnızca marangoz tezgâhında duruyor.","fx":["implicate:nusret"]},{"id":"kalip","title":"Kalıp kutusu","room":"Atölye","icon":"kutu","text":"Gümüş ustasının tezgâhındaki kalıp kutusunun listesinde yalnızca 800 ve 830 ayar kalıpları yazılı. Takımdaki sahte damga ise 925.","fx":["decoy"]},{"id":"test","title":"Ayar testi tutanağı","room":"Sergi salonu","icon":"dosya","text":"Haldun Bey ile Meryem 17:30'dan 18:10'a dek aynı masada. Asitli test sürekli gözlem ister; Haldun Bey her kaşık için ayrı imza atmış ve salondan ayrılmamış.","fx":["clear:meryem"]},{"id":"fis","title":"Kasa fişleri","room":"Kasa","icon":"fis","text":"17:32'den 18:04'e dek 9 fiş çıkmış, her 3-4 dakikada bir, hepsi Okan'ın kodu. Kasa ile atölye arasında arka avlu var, gidiş-dönüş 10 dakika.","fx":["clear:okan"]},{"id":"etiket","title":"Fiyat etiketi","room":"Kasa","icon":"not","text":"Okan'ın kasasında takımın fiyat etiketi duruyor: 'gümüş 925'. Etiketin üzerinde yazılma saati 18:12; yani etiket, damga görüldükten sonra yazılmış.","fx":["decoy"]},{"id":"teslim","title":"Teslim makbuzu","room":"Sokak","icon":"fis","text":"Çerçeve teslim makbuzunu karşı yakadaki dükkân 17:55'te Pınar'a imzalatmış. Dükkân kapı kaydına göre Pınar 17:20'de çıkmış, 18:20'ye dek girmemiş. Dükkânlar arası yürüyüş 25 dakika sürüyor.","fx":["clear:pinar"]}],"solution":"nusret","valid":["damga","test","fis","teslim"],"explain":"Suçlu Nusret. Meryem gözlem altında test yapıyordu, Okan kasadaydı, Pınar karşı yakadaydı: 17:55'te imza atıp 25 dakika uzakta olduğu için 18:05'te dönemezdi. Damga tahta tokmakla vurulmuş, çevresinde ahşap lifi var; bu takımın yanına yalnızca marangoz yaklaşırdı. Nusret ise takıma hiç yaklaşmadığını söyledi. Gümüşçünün kalıpları 925 değildi, etiket sonradan yazılmıştı.","decoyNote":"Gümüşçünün kalıbı 925 değildi; etiket damgadan sonra yazıldı."},{"day":11,"level":"Orta","title":"Bandın Sonundaki Valiz","place":"Selvikent Havalimanı Bagaj Salonu","rooms":["Bagaj bandı","Personel kapısı","Rampa","Yolcu salonu"],"hak":4,"mech":"sistem-kaydi","brief":"Nesrin Hanım'ın kilitli valizi 14:00'te bagaj bandına çıktı. İçindeki mücevher kutusu 14:10 ile 14:20 arasında alındı, valiz yeniden kapatıldı. Kutuyu alan kişi bandın arkasındaki personel bölümüne girmek zorundaydı.","suspects":[{"id":"ferit","name":"Ferit","role":"Bagaj görevlisi","statement":"14:00'ten sonra rampada uçak bagajı yükledim. 14:30'da salona döndüğümde valiz kapalıydı, içine bakmadım."},{"id":"aylin","name":"Aylin","role":"Check-in görevlisi","statement":"Mesai boyunca tezgâhımdan ayrılmadım. Bagaj bölümüne girmem, orada işim olmaz."},{"id":"orhan","name":"Orhan","role":"Yolcu","statement":"Uçağıma yetişmeye çalışıyordum. 14:00'ten sonra pasaport sırasındaydım, bagaj salonuna uğramadım."},{"id":"sevgi","name":"Sevgi","role":"Temizlik görevlisi","statement":"14:00 ile 14:30 arasında yolcu salonunun tuvaletlerini temizledim. Bagaj bölümü benim işim değil."}],"clues":[{"id":"kart","title":"Kapı okuyucusu","room":"Personel kapısı","icon":"kayit","text":"Okuyucu kaydı: 14:12'de 0417 numaralı kart giriş yapmış, 14:21'de aynı kart çıkış yapmış. 0417, check-in tezgâhı kartıdır ve Aylin'e zimmetlidir. 14:00-14:30 arasında başka kart okutulmamış.","fx":["implicate:aylin"]},{"id":"rampa","title":"Rampa telsiz günlüğü","room":"Rampa","icon":"defter","text":"Ferit 14:00'te A-12 uçağına çıkmış, her beş dakikada yükleme sayısı bildirmiş, 14:27'de rampadan ayrılmış. Rampadan personel bölümüne yürüyüş en az 6 dakika sürüyor.","fx":["clear:ferit"]},{"id":"sira","title":"Pasaport sırası fişi","room":"Yolcu salonu","icon":"fis","text":"Orhan'ın sıra numarası 13:58'de alınmış, damga 14:26'da vurulmuş. Sıra kordonu kapalı: sıradan çıkan yeniden numara alır, Orhan'ın fişinde tek numara var.","fx":["clear:orhan"]},{"id":"cizelge","title":"Temizlik çizelgesi","room":"Yolcu salonu","icon":"not","text":"Tuvaletler 14:00, 14:10, 14:20 ve 14:30'da salon amiri tarafından imzalanmış; her imza için Sevgi'nin yerinde olması şart. Salondan bandın arkasına yürüyüş 6 dakika.","fx":["clear:sevgi"]},{"id":"yag","title":"Kilitteki yağ izi","room":"Bagaj bandı","icon":"goz","text":"Valizin kilidinde yağlı bir parmak izi var. Orhan'ın uçuş kartında da aynı yağ lekesi görülüyor. Ama Nesrin Hanım'ın kendi el çantasında da aynı leke var: bandın yağlayıcısı kilit tarafındaki her bagaja bulaşıyor.","fx":["decoy"]}],"solution":"aylin","valid":["kart","rampa","sira","cizelge"],"explain":"Suçlu Aylin. Tezgâhından ayrılmadığını ve bagaj bölümüne girmediğini söyledi; oysa kendi kartı 14:12'de personel kapısından girip 14:21'de çıktı. Ferit rampadaydı, Orhan pasaport sırasındaydı, Sevgi'nin imzaları 10 dakika arayla atılmıştı; yürüyüş 6 dakika sürdüğü için gidip gelemezlerdi. Yağ lekesi bandın herkese bulaşan yağıydı.","decoyNote":"Yağ lekesi bandın her bagajında vardı, kimseyi göstermez."},{"day":11,"level":"Zor","title":"Yağmurlu İskele Gecesi","place":"Kuzuliman Vapur İskelesi","rooms":["Bilet gişesi","Bekleme salonu","Halat deposu","İskele ucu","Fener kulesi"],"hak":5,"rule":true,"mech":"iz-yonu","brief":"Yağmur 22:30'da başladı. Son vapur sırasında, 22:50 ile 23:10 arasında bilet gişesinin kasası boşaltıldı; gişe memuru Mahir o sırada gişede değildi. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: kasayı boşaltan da o.","suspects":[{"id":"gulay","name":"Gülay","role":"Çaycı","statement":"22:40'tan sonra bekleme salonunda yolculara çay dağıttım. Salondan çıkmadım, gişeye de hiç yaklaşmadım."},{"id":"tarik","name":"Tarık","role":"Halatçı","statement":"Yağmur başlayınca halat deposuna girdim, kapıyı çektim. 23:30'a kadar dışarı çıkmadım, gişe tarafına uğramadım."},{"id":"mahir","name":"Mahir","role":"Gişe memuru","statement":"22:50'de gişeyi kilitleyip vapurun rampasına gittim, bilet kontrolü yaptım. 23:15'e kadar iskele ucundan ayrılmadım."},{"id":"selma","name":"Selma","role":"Fener bakıcısı","statement":"22:35'te fenerin yağını doldurmak için kuleye çıktım. 23:20'ye kadar aşağı inmedim."}],"clues":[{"id":"gisekapi","title":"Gişe arka kapısı","room":"Bilet gişesi","icon":"ayakizi","text":"Gişenin arka kapısına tek bir ıslak çizme izi dizisi uzanıyor. İzler halat deposunun eşiğinden başlıyor, gişe kapısında bitiyor; dönüş izleri parmak uçları depoya dönük. Gişe önünde başka iz yok.","fx":["implicate:tarik"]},{"id":"salonkamera","title":"Salon kamerası","room":"Bekleme salonu","icon":"kamera","text":"Kamera salonu ve tek çıkış kapısını gösteriyor. 22:40-23:15 kaydı kesintisiz: Gülay çay tepsisiyle masalar arasında dolaşıyor, kapıya hiç yaklaşmıyor.","fx":["clear:gulay"]},{"id":"rampadefter","title":"Vapur rampa defteri","room":"İskele ucu","icon":"defter","text":"Kaptan, Mahir'in 22:52'den 23:14'e kadar rampada bilet kontrol ettiğini her 4 dakikada bir yolcu sayısı satırıyla imzalamış. Rampadan gişeye gidiş yağmurda en az 5 dakika sürüyor.","fx":["clear:mahir"]},{"id":"fenergunluk","title":"Fener günlüğü","room":"Fener kulesi","icon":"defter","text":"Yağlama 22:35'te başlamış; her 10 dakikada bir ışık ayarı notu Selma'nın yazısıyla yazılmış, son not 23:18. Kule kapısı içeriden sürgülü bulunmuş. Kuleden inip çıkmak 12 dakika sürüyor.","fx":["clear:selma"]},{"id":"kasa","title":"Kasanın kilidi","room":"Bilet gişesi","icon":"anahtar","text":"Kasa zorlanmadan açılmış. Asıl anahtar Mahir'de. Ama yedek anahtar gişe duvarında, çivide asılı duruyor; gişeye gelen herkes görebiliyor.","fx":["decoy"]},{"id":"yagvaril","title":"Yağ varili","room":"Halat deposu","icon":"kutu","text":"Kasa kapağında fener yağı lekesi bulundu. Ama depodaki yağ varili sızdırıyor; akşamdan beri iskelede çalışan herkesin eli ve çizmesi yağlı.","fx":["decoy"]}],"solution":"tarik","valid":["gisekapi","salonkamera","rampadefter","fenergunluk"],"explain":"Suçlu Tarık. Halat deposundan çıkmadığını söyledi; oysa gişe kapısına giden ıslak izler deponun eşiğinden başlıyor ve depoya dönüyor. Gülay kamerada kesintisiz görünüyor, Mahir rampa defterinde 4 dakikalık imzalarla kaptanın gözü önünde, Selma'nın kule notları 10 dakikada bir sürüyor. Yedek anahtar ve yağ lekesi herkesin ulaşabileceği şeylerdi.","decoyNote":"Yedek anahtar ve yağ lekesi herkesin ulaşabileceği şeylerdi."},{"day":12,"level":"Orta","title":"Emanetteki Cep Saati","place":"Demirgöl Tren Garı","rooms":["Bilet gişesi","Kantin","Emanet odası","Peron"],"hak":4,"mech":"ortak-mazeret","brief":"Yolcu Hamdi Bey'in emanet ettiği cep saati, emanet odasındaki 14 numaralı dolaptan 18:10 ile 18:25 arasında alındı. Oda kilitliydi; oda da dolap da yedek anahtarla açılmış.","suspects":[{"id":"kadir","name":"Kadir","role":"Emanetçi","statement":"18:00'de gar şefi beni odasına çağırdı. Emanet odasını kilitleyip gittim, 18:40'ta döndüm."},{"id":"yunus","name":"Yunus","role":"Gişe memuru","statement":"18:00'de gişeyi kapattım, kantine gidip Ece'yle çay içtim. Yedek anahtarlara dokunmadım."},{"id":"ece","name":"Ece","role":"Kantinci","statement":"Yunus 18:00'den 18:30'a kadar benimle kantindeydi. Ben tezgâhtan hiç ayrılmadım."},{"id":"nalan","name":"Nalan","role":"Peron görevlisi","statement":"18:25 treninin kalkış işaretini verdim. Peron dışına çıkmadım."}],"clues":[{"id":"anahtar","title":"Yedek anahtar defteri","room":"Bilet gişesi","icon":"anahtar","text":"Yedek anahtar kutusu defteri: yedek anahtar 18:02'de 'Y.' imzasıyla çıkış yapmış, 18:31'de iade edilmiş. Gişede 'Y' ile başlayan başka çalışan yok.","fx":["implicate:yunus"]},{"id":"kantinkamera","title":"Kantin kamerası","room":"Kantin","icon":"kamera","text":"18:00-18:30 kaydı kesintisiz: Ece tezgâhın arkasında yalnız, masalar boş, kapıdan kimse girmiyor.","fx":["clear:ece"]},{"id":"peronturnike","title":"Peron görev çizelgesi","room":"Peron","icon":"defter","text":"Nalan 18:05'ten 18:26'ya kadar peron kenarında işaret görevinde. Peron çıkışı turnikelidir ve kart okutulur; bu aralıkta Nalan'a ait çıkış kaydı yok. Perondan emanet odasına yürüyüş 7 dakika.","fx":["clear:nalan"]},{"id":"toplanti","title":"Toplantı notu","room":"Emanet odası","icon":"not","text":"Kapıda not: 'Emanetçi gar şefiyle toplantıda, 18:00-18:40.' Şefin tutanağında Kadir 18:03 ve 18:38 imzalı; toplantıya ara verilmedi, sekreter kapıda bekledi. Şef odası 8 dakika uzakta.","fx":["clear:kadir"]},{"id":"dolapizi","title":"Dolap kapağı","room":"Emanet odası","icon":"goz","text":"14 numaralı dolabın kapağında Kadir'in parmak izleri belirgin. Ama aynı izler diğer 31 dolapta da var; Kadir her gün dolapları kendi eliyle sıralıyor.","fx":["decoy"]}],"solution":"yunus","valid":["anahtar","kantinkamera","peronturnike","toplanti"],"explain":"Suçlu Yunus. Ece kantinde yalnız olduğunu gösteren kameraya rağmen Yunus'un yanında olduğunu söyledi; ikisi birbirini aklamaya çalışmıştı. Yedek anahtar 18:02'de 'Y.' imzasıyla alınmıştı. Kadir toplantıdaydı, Nalan peronda kayıtlıydı. Dolaptaki parmak izi emanetçinin günlük işinden kalmıştı.","decoyNote":"Kadir'in izi tüm dolaplarda vardı; işi gereği."},{"day":12,"level":"Zor","title":"Kanal Kapağının Defteri","place":"Saz Kanalı Su Kapağı","rooms":["Kapak odası","Bekçi kulübesi","Kooperatif ofisi","Ölçüm istasyonu","Köprü kulübesi"],"hak":5,"rule":true,"mech":"kayit-celiskisi","brief":"Saz Kanalı'nın ana kapağı gece 02:10 ile 02:50 arasında yetkisiz açıldı; su, kotası olmayan bir tarlaya aktı. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: kapağı açan da o.","suspects":[{"id":"hanife","name":"Hanife","role":"Kooperatif muhasebecisi","statement":"Gece ofiste kota hesabı yaptım. 01:50'den 03:10'a kadar kapıyı hiç açmadım."},{"id":"cemal","name":"Cemal","role":"Gece nöbetçisi","statement":"01:00'den 04:00'e kadar köprü kulübesinde nöbet tuttum. Nöbet defterimi eksiksiz yazdım."},{"id":"rifat","name":"Rıfat","role":"Kapak bekçisi","statement":"01:30'da kulübeme kapandım, sabaha kadar çıkmadım. Kapağı kimin açtığını görmedim."},{"id":"berna","name":"Berna","role":"Ölçüm teknisyeni","statement":"01:30'dan 04:00'e kadar ölçüm istasyonunda hat testi yaptım. İstasyon yukarıda, oradan ayrılmadım."}],"clues":[{"id":"nobetdefter","title":"Nöbet defteri","room":"Köprü kulübesi","icon":"defter","text":"01:00, 02:00 ve 03:00 satırları tam. Ayrıca 02:20 satırında 'yağmur başladı, kapüşon taktım' yazıyor. Kulübenin sabit telefonu 02:05, 02:25 ve 02:45'te çalmış, arama kaydına göre hiçbiri açılmamış. Bütün satırlar aynı kalemle, aynı sıkılıkta yazılmış.","fx":["implicate:cemal"]},{"id":"istasyon","title":"İstasyon kapı kaydı","room":"Ölçüm istasyonu","icon":"kayit","text":"Berna 01:28'de girmiş, 04:02'de çıkmış; turnike her geçişi kaydeder, arada başka geçiş yok. Yağış ölçer istasyonun çatısında; yağmur kanal havzasında her yere aynı anda başlar, köprü dahil. Ölçer ilk damlayı 03:40'ta kaydetmiş, ondan önce gece kuru. İstasyon 9 km yukarıda.","fx":["clear:berna"]},{"id":"kulubesensor","title":"Kulübe kapı sensörü","room":"Bekçi kulübesi","icon":"kapi","text":"Sensör kaydı: kapı 01:31'de kapanmış, 04:06'da açılmış. Pencere demir parmaklıklı ve içeriden sürgülü.","fx":["clear:rifat"]},{"id":"ofisalarm","title":"Ofis alarm kaydı","room":"Kooperatif ofisi","icon":"kilit","text":"Alarm 01:49'da kurulmuş, 03:12'de çözülmüş. Bu sürede kapı ve pencere sensörleri hiç ötmemiş.","fx":["clear:hanife"]},{"id":"kotasayfa","title":"Kota sayfası","room":"Kapak odası","icon":"not","text":"Masada Hanife'nin yazısıyla 'sulama 02:00' notlu bir kota sayfası var. Sayfanın köşesindeki tarih geçen haftaya ait; haftalık sulama programı her hafta aynı saati yazıyor.","fx":["decoy"]},{"id":"olcucubuk","title":"Ölçüm çubuğu","room":"Kapak odası","icon":"alet","text":"Kapak oluğunun yanında Berna'nın adı yazılı bir ölçüm çubuğu duruyor. Yanındaki zimmet fişinde 'Berna, kalibrasyon, dün 18:00, bırakıldı' yazıyor.","fx":["decoy"]}],"solution":"cemal","valid":["nobetdefter","istasyon","kulubesensor","ofisalarm"],"explain":"Suçlu Cemal. Nöbet defterinde 02:20'de 'yağmur başladı' yazıyor; oysa yağmur havzada aynı anda başlar ve ölçer 03:40'ta kaydetmiş. Kulübe telefonu 02:05-02:45 arası açılmadı; satırlar önceden yazılmış, Cemal kulübede değildi. Hanife ofiste alarmlı, Rıfat sensörlü kulübede, Berna istasyonda kayıtlıydı. Kota sayfası ve çubuk eski bırakılmış eşyalardı.","decoyNote":"Sayfa geçen haftadan, çubuk dünden kalmaydı."},{"day":13,"level":"Orta","title":"Köşkteki Yedek Anahtar","place":"Boğazkıyı Araba Feribotu","rooms":["Kaptan köşkü","Lostromo kulübesi","Makine dairesi","Yolcu salonu","Araç güvertesi"],"hak":4,"mech":"eksik-parca","brief":"Feribot iskeleye yanaşmışken 15:30 ile 16:15 arasında kaptan köşkündeki evrak dolabından çevre izin formları alındı. Dolap zorlanmamış, yedek anahtarla açılmış. Yedek anahtar lostromo kulübesindeki panoda asılı dururdu.","suspects":[{"id":"pinar","name":"Pınar","role":"Makinist","statement":"Motoru ısıtmak için makine dairesine indim, 16:15'e kadar çıkmadım. Yedek anahtarlardan haberim yok."},{"id":"dogan","name":"Doğan","role":"Lostromo","statement":"Güvertede halatları kontrol ettim, köşke çıkmadım. Panodaki yedek anahtara dokunmadım, yerindeydi."},{"id":"leyla","name":"Leyla","role":"Kafeterya görevlisi","statement":"Öğleden sonra salonda çay sattım. Köşke sadece sabah çay götürdüm, dolaba hiç yaklaşmadım."},{"id":"murat","name":"Murat","role":"İkinci kaptan","statement":"Araç yüklemesi sırasında rampa başındaydım. Köşke bu sürede çıkmadım."}],"clues":[{"id":"pano","title":"Anahtar panosu","room":"Lostromo kulübesi","icon":"anahtar","text":"Pano kancası 7 boş. Zimmet defterinde 15:42 satırı: 'Yedek anahtar 7 alındı, imza: D.' İade satırı boş. Personelde 'D' ile başlayan başka kimse yok.","fx":["implicate:dogan"]},{"id":"yukleme","title":"Yükleme listesi","room":"Araç güvertesi","icon":"defter","text":"28 araç, 15:35'ten 16:10'a kadar; her aracın yanında Murat'ın imzası var, imzalar 1-2 dakika arayla. Rampadan köşke merdivenle çıkış 4 dakika sürüyor.","fx":["clear:murat"]},{"id":"manometre","title":"Manometre çizelgesi","room":"Makine dairesi","icon":"saat","text":"15:30'dan 16:15'e kadar her 5 dakikada bir okuma, aynı kalem, aynı el. Makine dairesinden çıkışta alarm ötüyor; alarm kaydı boş.","fx":["clear:pinar"]},{"id":"kasafis","title":"Kafeterya fişleri","room":"Yolcu salonu","icon":"fis","text":"15:40'tan 16:10'a kadar ardışık 22 fiş, aralar en fazla 2 dakika. Kasada tek görevli var. Salondan köşke çıkış 5 dakika sürüyor.","fx":["clear:leyla"]},{"id":"mendil","title":"Dolap önündeki mendil","room":"Kaptan köşkü","icon":"goz","text":"Dolabın önünde kafeterya logolu bir mendil bulundu. Mendil kurumuş çay lekesi içinde; köşke her sabah 11:00'de çay götürülüyor ve halıdaki leke de eski.","fx":["decoy"]}],"solution":"dogan","valid":["pano","yukleme","manometre","kasafis"],"explain":"Suçlu Doğan. Panodaki yedek anahtara dokunmadığını söyledi; zimmet defteri 7 numaralı yedeğin 15:42'de 'D.' imzasıyla alındığını ve geri verilmediğini gösteriyor. Murat rampada, Pınar makine dairesinde, Leyla kasada olduğu için köşke çıkamazdı. Mendil sabah çayından kalmaydı.","decoyNote":"Mendil sabah çayından kalmaydı, leke eskiydi."},{"day":13,"level":"Zor","title":"Örtülü Aynalar","place":"Tuzburnu Feneri","rooms":["Lens odası","Kule merdiveni","Jeneratör odası","Bakıcı evi","Mutfak","İskele"],"hak":5,"rule":true,"mech":"imkansiz-bilgi","brief":"Kule ışığı 02:15 ile 02:30 arasında söndü. Sabah 06:00'da müdür lens odasını açınca aynaların bir çarşafla örtülü olduğunu gördü ve bunu henüz kimseye söylemedi. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: örtüyü seren de o.","suspects":[{"id":"aysel","name":"Aysel","role":"Aşçı","statement":"01:30'dan 03:30'a kadar mutfakta sabah ekmeğini yoğurdum. Kuleye çıkmadım."},{"id":"selcuk","name":"Selçuk","role":"Tamirci","statement":"02:15'te iskelede kayığın motorunu onarıyordum. Kuleye baktığımda aynaların örtülü olduğunu gördüm, kimseye söylemedim."},{"id":"teoman","name":"Teoman","role":"İkinci bakıcı","statement":"02:00'de nöbeti devraldım, 04:00'e kadar jeneratör odasından ayrılmadım."},{"id":"gonul","name":"Gönül","role":"Acente yetkilisi","statement":"Bakıcı evinde misafirdim. 01:00'den sabaha kadar odamda uyudum."}],"clues":[{"id":"lens","title":"Lens odası kepenkleri","room":"Lens odası","icon":"pencere","text":"Lens odasının kepenkleri dışarıdan sürgülü, camları buzlu; dışarıdan içerisi hiçbir yerden görünmez. Odaya girip örtüyü ilk gören müdür olmuş. Çarşaf kuru ve tozsuz.","fx":["implicate:selcuk"]},{"id":"panel","title":"Panel şeridi","room":"Jeneratör odası","icon":"saat","text":"02:00'dan 04:00'e her 15 dakikada ince kalemle yazılmış okuma var, tek el. Odanın kapı zili girişte çalıyor; zil kaydı 02:00-04:00 arasında boş.","fx":["clear:teoman"]},{"id":"mutfakkamera","title":"Mutfak kamerası","room":"Mutfak","icon":"kamera","text":"01:30-03:30 kaydı kesintisiz: Aysel hamur masasından hiç uzaklaşmıyor. Kuleye gitmek mutfaktan dışarı çıkışı gerektirir ve çıkış kapısı da kameralı.","fx":["clear:aysel"]},{"id":"kapisayac","title":"Kapı sayacı","room":"Bakıcı evi","icon":"kilit","text":"Misafir odasının kapı sayacı 01:05'te 14'e gelmiş, sabah 05:00'e kadar 14'te kalmış. Odanın tek penceresi demir parmaklıklı.","fx":["clear:gonul"]},{"id":"unizi","title":"Basamaklardaki un","room":"Kule merdiveni","icon":"ayakizi","text":"Merdivenin ilk iki basamağında un izleri var. İzlerin üstünde dün akşamki bakıcı çizmelerinin izleri duruyor, un daha eski. Kuleye giden başka un izi yok.","fx":["decoy"]},{"id":"tekneip","title":"İskele halkasındaki ip","room":"İskele","icon":"arac","text":"Halkaya Gönül'ün acente teknesinin renginde bir ip bağlı. Gece sis yüzünden iskele tahtaları ıslaktı; ip ise kuru ve toz tutmuş durumda.","fx":["decoy"]}],"solution":"selcuk","valid":["lens","panel","mutfakkamera","kapisayac"],"explain":"Suçlu Selçuk. Kepenkler dışarıdan sürgülü, camlar buzlu olduğu için iskeleden aynaların örtülü olduğu görülemezdi; üstelik örtüyü müdürden başka kimse bilmiyordu. Aysel mutfak kamerasında, Teoman panel şeridinde, Gönül kapı sayacında kayıtlıydı. Un izi eski, tekne ipi kuru ve tozluydu.","decoyNote":"Un izi eskiydi, ip de gece orada değildi."},{"day":14,"level":"Orta","title":"Pencere Altındaki Torba","place":"Çınaraltı Tramvay Deposu","rooms":["Depo bahçesi","Atölye","Depo kapısı","Mola odası","Yıkama alanı"],"hak":4,"mech":"yer-degisimi","brief":"Vezne odasındaki günlük hasılat torbası 17:45 ile 18:00 arasında kayboldu. Boş torba 18:20'de vezne penceresinin altında bulundu; pencere açıktı. Parayı alan kişi sahneyi dışarıdan hırsız girmiş gibi göstermeye çalışmış olabilir.","suspects":[{"id":"zehra","name":"Zehra","role":"Veznedar","statement":"17:40'ta bankaya havale için depodan çıktım, 18:15'te döndüm. Vezneyi kilitleyip gittim."},{"id":"burak","name":"Burak","role":"Tramvay sürücüsü","statement":"Son seferden 18:10'da depoya döndüm. O saate kadar hatta idim, depoya hiç uğramadım."},{"id":"asli","name":"Aslı","role":"Temizlik görevlisi","statement":"17:40'tan sonra vagonların halılarını yıkadım. Yıkama alanından ayrılmadım."},{"id":"ekrem","name":"Ekrem","role":"Depo şefi","statement":"17:35'ten 18:10'a kadar mola odasında bölge müdürüyle toplantıdaydım."}],"clues":[{"id":"sayac","title":"Depo giriş sayacı","room":"Depo kapısı","icon":"kayit","text":"T-4 tramvayı 17:41'de depoya girmiş, 18:08'de çıkmış. T-4'ü bu vardiyada yalnızca Burak sürüyor; vardiya çizelgesinde başka sürücü yazılı değil. Çıkışı kayıtlı 18:08, yani Burak 18:10'dan önce depodaydı.","fx":["implicate:burak"]},{"id":"turnike","title":"Personel turnikesi","room":"Depo kapısı","icon":"kapi","text":"Zehra 17:41'de çıkış, 18:14'te giriş yapmış. Bu aralıkta başka turnike kaydı yok. Depodan bankaya yürüyüş 12 dakika sürüyor.","fx":["clear:zehra"]},{"id":"toplanti","title":"Toplantı tutanağı","room":"Mola odası","icon":"dosya","text":"Bölge müdürü, iki sürücü (Selim ve Rıza; Burak değil) ve Ekrem 17:35'ten 18:10'a kadar kesintisiz görüşmüş. Tutanağın her sayfasında Ekrem'in imzası ve saat damgası var.","fx":["clear:ekrem"]},{"id":"yikama","title":"Halı yıkama makinesi","room":"Yıkama alanı","icon":"alet","text":"Makinenin kolu basılı tutulmadıkça çalışmıyor. Sayaç 17:40'tan 18:05'e kadar kesintisiz çalışmış; kol bırakılınca makine duruyor.","fx":["clear:asli"]},{"id":"dolap","title":"Sürücü dolapları","room":"Atölye","icon":"kutu","text":"Sürücü dolapları sürücülere zimmetli; 5 numara Burak'ın dolabı. Dolabın yağ kutusunda lastik bantlı banknotlar bulundu. Para torbadan çıkarılıp buraya taşınmış; torba sonradan pencere altına bırakılmış.","fx":["context"]},{"id":"botizi","title":"Pencere altı izleri","room":"Depo bahçesi","icon":"ayakizi","text":"Boş torbanın yanından bahçe kapısına bot izleri gidiyor; Ekrem'in iş botuna benziyor. Ama vezne penceresinin pervazındaki toz bozulmamış; pencereden torba atan ya da atlayan biri tozu silerdi.","fx":["decoy"]}],"solution":"burak","valid":["sayac","turnike","toplanti","yikama"],"explain":"Suçlu Burak. Depoya 18:10'dan önce uğramadığını söyledi; oysa T-4 tramvayı 17:41'de depoya girmişti. Zehra turnike kaydıyla dışarıdaydı, Ekrem tutanaklı toplantıdaydı, Aslı yıkama makinesinin başındaydı. Torba pencereden atılmamıştı, pervazdaki toz sağlamdı; sahne sonradan kurulmuştu.","decoyNote":"Pervaz tozu bozulmamıştı; torba pencereden atılmamıştı."},{"day":14,"level":"Zor","title":"Otogarda Kurulu Anons","place":"Kumsaldere Otogarı","rooms":["Kargo deposu","Anons odası","Gişe salonu","Peron"],"hak":5,"rule":true,"mech":"sahte-alibi","brief":"Gece 23:10 ile 23:30 arasında kargo deposundan değerli bir koli alındı; depo kilidi anahtarla açılmış. Gişeden depoya yürüyüş 5 dakika. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: kolinin hırsızı da o.","suspects":[{"id":"sinan","name":"Sinan","role":"Kargo görevlisi","statement":"22:50'de depoyu kilitledim, sonra forkliftle peronda yük taşıdım."},{"id":"dilek","name":"Dilek","role":"Gişe memuru","statement":"23:00'den 23:45'e kadar gişede bilet kestim. Kuyruk vardı, yerimden kalkmadım."},{"id":"yilmaz","name":"Yılmaz","role":"Anons görevlisi","statement":"23:00'den 23:40'a kadar anons odasındaydım. 23:15 kalkış anonsunu canlı ben okudum."},{"id":"perihan","name":"Perihan","role":"Peron amiri","statement":"23:00-23:40 arasında peronda otobüsleri yönlendirdim, peron dışına çıkmadım."}],"clues":[{"id":"anonskayit","title":"Anons sistemi kaydı","room":"Anons odası","icon":"kayit","text":"23:15 anonsu zamanlayıcıdan, kayıttan çalınmış. Mikrofon 23:00-23:40 arasında hiç açılmamış. Zamanlayıcıyı 22:58'de kuran kişi, oda kart kaydına göre Yılmaz.","fx":["implicate:yilmaz"]},{"id":"gisesatis","title":"Gişe satış kaydı","room":"Gişe salonu","icon":"fis","text":"23:02'den 23:44'e kadar en çok 3 dakika arayla satış var; her satışta gişe memurunun parmak izi okutulmuş. Gişeden depoya yürüyüş 5 dakika.","fx":["clear:dilek"]},{"id":"forklift","title":"Forklift ka
