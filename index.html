muş. Heykel yağmur başlamadan, yani 21:00'den önce buraya konmuş.","fx":["context"]},{"id":"kart","title":"Personel kart kaydı","room":"Giriş","icon":"kayit","text":"O akşam iki çıkış var: Cevdet 20:12, Yıldız 20:50. Alarm 20:55'te Yıldız'ın koduyla kurulmuş, sonra içeri giren olmamış. Vitrin anahtarı ofis panosunda asılı; tüm personel alabiliyor.","fx":["implicate:yildiz"]},{"id":"otel","title":"Otel kayıt fişi","room":"Giriş","icon":"fis","text":"Hakan'ın giriş fişi 19:55. Oda kapısı kaydında 19:58'den sabaha kadar odadan çıkış yok.","fx":["clear:hakan"]},{"id":"toplanti","title":"Toplantı tutanağı","room":"Ofis","icon":"dosya","text":"Kafedeki yönetim toplantısı 20:00-21:30 sürmüş. Fikret imzalı, toplantıdan çıkan olmamış; kafe kapısı kaydı da aynı.","fx":["clear:fikret"]},{"id":"yayin","title":"Canlı yayın kaydı","room":"Ofis","icon":"kamera","text":"Dilan'ın yayını 20:00-23:00 arası kesintisiz, evinden. Yayın saatleri şebeke saatine bağlı.","fx":["clear:dilan"]}],"solution":"yildiz","valid":["kart","otel","toplanti","yayin"],"explain":"Suçlu Yıldız. Heykel 20:10'dan sonra, yağmur başlamadan vitrinden alınıp saksıya konmuş. O saatlerde binada yalnızca Yıldız vardı: kart kaydına göre 20:50'de çıktı, ‘19:45’ diyerek yalan söyledi. Fikret, Dilan ve Hakan başka yerdeydi. Cam çiziği eskiydi.","decoyNote":"Çizik eski ve tozluydu; hırsız dışarıdan gelmemişti."},{"day":19,"level":"Zor","title":"Geri Kalan Saat","place":"Kirpi Sahaf Kitabevi","rooms":["Ön tezgâh","Nadir bölüm","Arka oda","Sokak"],"hak":5,"rule":true,"mech":"sahte-alibi","brief":"Nadir bölümündeki ilk baskı şiir kitabını Nuri 19:00'da yerinde gördü; 19:30'da yoktu. Dükkân 19:00'da kapandı, çıkanlar kapıyı kilitliyor. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: kitabı alan da o.","suspects":[{"id":"nuri","name":"Nuri","role":"Sahaf","statement":"19:05'ten 19:45'e kadar yan binadaki basım birliği toplantısındaydım."},{"id":"ece","name":"Ece","role":"Tezgâhtar","statement":"Kasayı kapatıp çıktım; çıkış fişimde 18:45 yazıyor, o saatte çıktım. Kitaba dokunmadım."},{"id":"cengiz","name":"Cengiz","role":"Kurye","statement":"Akşam başka ilçede iki paket teslim ettim. Dükkâna dönmedim."},{"id":"melis","name":"Melis","role":"Koleksiyoncu","statement":"Dükkâna 18:40'ta uğradım, 18:50'de çıkıp trene yetiştim."}],"clues":[{"id":"kasa","title":"Yazar kasa servis kaydı","room":"Ön tezgâh","icon":"saat","text":"Kasanın saati bu sabah 40 dakika geriye alınmış. Kasa fişlerindeki saat, gerçek saatten 40 dakika geride.","fx":["context"]},{"id":"firin","title":"Fırın kamerası","room":"Sokak","icon":"kamera","text":"Bitişik fırının kamerası şebeke saatine bağlı. 19:25'te dükkân kapısından Ece çıkıp kapıyı kilitliyor. 19:00-19:25 arası dükkâna giren çıkan görünmüyor.","fx":["implicate:ece"]},{"id":"tutanak","title":"Basım birliği tutanağı","room":"Ön tezgâh","icon":"dosya","text":"Toplantı 19:05-19:45 arası yan binada sürmüş. Nuri imzalı, salondan çıkmamış.","fx":["clear:nuri"]},{"id":"konum","title":"Kurye dökümü","room":"Arka oda","icon":"telefon","text":"Uygulama kaydı: 18:45-19:35 arası Cengiz başka ilçede, her 5 dakikada bir konum var. Teslimler 19:04 ve 19:21, müşteri imzalı.","fx":["clear:cengiz"]},{"id":"bilet","title":"Tren turnikesi","room":"Nadir bölüm","icon":"kayit","text":"Melis'in bileti 18:52'de turnikede okutulmuş. Tren 19:00'da kalkmış, bilet iade edilmemiş.","fx":["clear:melis"]},{"id":"karti","title":"Koleksiyoncu kartı","room":"Nadir bölüm","icon":"not","text":"Vitrinin üstünde Melis'in koleksiyoncu kartı duruyor. Kartın üzerinde geçen haftanın tarihi var; aynı kart haftadır tezgâhın üstünde tozlanıyordu.","fx":["decoy"]},{"id":"kutu","title":"Boş kitap kutusu","room":"Arka oda","icon":"kutu","text":"Arka odada Cengiz'in çantasından düşmüş boş bir koli var. Üstünde ‘teslim edildi 19:21’ damgası var ve ilk baskı bir şiir kitabından kat kat büyük.","fx":["decoy"]}],"solution":"ece","valid":["firin","tutanak","konum","bilet"],"explain":"Suçlu Ece. Kasa saati 40 dakika geriydi: fişteki 18:45 gerçekte 19:25'e denk gelir. Fırın kamerası da Ece'nin 19:25'te çıktığını gösteriyor, yani kitap alınırken içerideydi. Nuri toplantıda, Cengiz başka ilçede, Melis trendeydi. Kart ve koli yanıltmacaydı.","decoyNote":"Kart eski tarihliydi; koli teslim edilmiş büyük bir pakete aitti."},{"day":20,"level":"Orta","title":"Değişen Çerçeve","place":"Kent Tarih Müzesi","rooms":["Gravür salonu","Müze atölyesi","Müze ofisi","Personel girişi"],"hak":4,"mech":"rol-uyusmazligi","brief":"Salı 17:40'ta küratör gravürü kontrol etti, orijinaldi. 18:30'daki güvenlik turunda çerçevedeki baskının sahte bir kopya olduğu görüldü; çerçeve vidalarla açılıp kapatılmıştı. Salon kapısı kilitli değildi.","suspects":[{"id":"hasan","name":"Hasan","role":"Güvenlik görevlisi","statement":"17:40'tan 18:30'a kadar devriye turlarımı attım, kartı her noktada okuttum."},{"id":"sevil","name":"Dr. Sevil","role":"Küratör","statement":"17:45'ten 18:30'a kadar ofiste sponsorla görüntülü toplantıdaydım."},{"id":"tayfun","name":"Tayfun","role":"Bakım teknisyeni","statement":"17:40'ta işten çıktım. Atölye takımlarım yerinde duruyor."},{"id":"isil","name":"Işıl","role":"Rehber","statement":"Ben sadece rehberim. Çerçeve vidasına, alete dokunmam; nasıl söküldüğünü de bilmem."}],"clues":[{"id":"dolap","title":"Rehber dolabı","room":"Personel girişi","icon":"kutu","text":"Işıl'ın dolabında T15 torx anahtarı ve bir rulo arşiv bandı var. Çerçeve vidaları T15. Rehberlerin işi gereği alet ya da arşiv bandı taşıması gerekmiyor. Salon kapısı kaydına göre 18:05-18:21 arası salona yalnızca Işıl girmiş.","fx":["implicate:isil"]},{"id":"devriye","title":"Devriye kayıtları","room":"Gravür salonu","icon":"kayit","text":"Hasan'ın kartı 17:42-18:28 arası, hiçbir aralık 3 dakikayı geçmeden 14 farklı noktada okutulmuş. Denemede çerçeveyi sökmek ve takmak 15 dakika sürdü.","fx":["clear:hasan"]},{"id":"toplanti","title":"Toplantı kaydı","room":"Müze ofisi","icon":"kamera","text":"Sponsor toplantısı kaydında Sevil 17:45-18:30 arası kesintisiz görünüyor. Arkada ofis kapısı kapalı.","fx":["clear:sevil"]},{"id":"cikis","title":"Personel çıkış kaydı","room":"Personel girişi","icon":"kayit","text":"Tayfun 17:44'te çıkış yapmış, otobüs kartı 17:52'de kullanılmış. O akşam geri dönmemiş.","fx":["clear:tayfun"]},{"id":"takim","title":"Atölye takımı","room":"Müze atölyesi","icon":"alet","text":"Torx takımı Tayfun'a ait. Kutu tam, T15 yerinde ve üzerinde toz var; son kullanımı geçen ayın bakım kaydında yazıyor.","fx":["decoy"]}],"solution":"isil","valid":["dolap","devriye","toplanti","cikis"],"explain":"Suçlu Işıl. Sahtesi takılan çerçevenin T15 vidalarla sökülmesi gerekiyordu. Işıl ‘alete dokunmam’ dedi, oysa dolabında T15 anahtarı ve arşiv bandı var; bir rehber için anlamsız. Hasan sürekli devriyedeydi, Sevil toplantıda, Tayfun çoktan çıkmıştı. Atölyenin T15'i tozlu ve yerindeydi.","decoyNote":"Atölyenin T15 anahtarı yerinde ve tozluydu; kullanılan anahtar başkasındaydı."},{"day":20,"level":"Zor","title":"Mor Kalem","place":"Mimoza Güzel Sanatlar Lisesi","rooms":["Jüri odası","Sekreterlik","Öğretmenler odası","Okul önü","Müdür odası"],"hak":5,"rule":true,"mech":"zincir-kanit","brief":"Resim yarışmasının puan tablosu 15:00'te taranıp jüri odasına bırakıldı, doğruydu. 15:30'da alınan ikinci taramada iki puan değişmişti. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: puanları değiştiren de o.","suspects":[{"id":"nilgun","name":"Nilgün","role":"Sekreter","statement":"Tabloyu 15:00'te tarayıp jüri odasına bıraktım ve bir daha girmedim. 15:30'a kadar sekreterlikte fotokopi çektim."},{"id":"aysel","name":"Aysel","role":"Resim öğretmeni","statement":"Bana verilen hediye kalem kutusunda duruyor, hiç açmadım. Öğleden sonra sınıf hazırlığı yaptım."},{"id":"tolga","name":"Tolga","role":"Müdür yardımcısı","statement":"14:50'den 15:40'a kadar öğrenci gezisi için otobüsteydim, okulda değildim."},{"id":"barlas","name":"Barlas","role":"Konuk ressam","statement":"Jüri odasında yalnızca puanları okudum, tabloya dokunmadım. Hediye kalemi kutusundan çıkarmadım bile."}],"clues":[{"id":"tablo","title":"Puan tablosu","room":"Jüri odası","icon":"dosya","text":"İkinci taramada iki puan mor, ince fırça uçlu bir kalemle düzeltilmiş. Bu marka okulda yalnızca bu hafta jüriye hediye edilen iki sette var: biri Barlas'ta, biri Aysel'de.","fx":["context"]},{"id":"cop","title":"Jüri odası çöpü","room":"Jüri odası","icon":"kutu","text":"Çöp 14:45'te boşaltılmıştı. İçinde şimdi üzerinde ‘Barlas’ yazan, açılmış bir hediye kalem ambalajı ve mor lekeli bir peçete var. Jüri odası giriş defterinde Barlas 15:05-15:25 arası imzalı; o saatlerde başka imza yok.","fx":["implicate:barlas"]},{"id":"muhur","title":"Aysel'in dolabı","room":"Öğretmenler odası","icon":"kilit","text":"Aysel'in dolabında hediye kalem seti duruyor. Kutunun mührü bozulmamış, plastik film sağlam.","fx":["clear:aysel"]},{"id":"sayac","title":"Fotokopi sayacı","room":"Sekreterlik","icon":"fis","text":"Nilgün'ün koduyla 15:01-15:29 arası 80 kopya çekilmiş; sayaçta bir dakikadan uzun boşluk yok. Sekreterlik kapısı bu sürede açılmamış.","fx":["clear:nilgun"]},{"id":"otobus","title":"Gezi otobüsü","room":"Okul önü","icon":"kamera","text":"Otobüs kamerası ve öğrenci listesi: Tolga 14:50'de binmiş, 15:40'ta inmiş. Otobüs bu sürede okuldan ayrıldı.","fx":["clear:tolga"]},{"id":"leke","title":"Aysel'in masası","room":"Öğretmenler odası","icon":"goz","text":"Masada mor mürekkep lekesi var. Leke yuvarlak uçlu öğrenci kalemlerinin izi, fırça ucunun ince çizgisine benzemiyor; masada öğrenci boyaları da duruyor.","fx":["decoy"]},{"id":"anahtar","title":"Yedek anahtar","room":"Müdür odası","icon":"anahtar","text":"Jüri odasının yedek anahtarı müdür yardımcısının odasında duruyor. Ancak jüri odası gün boyu açık kaldı, anahtara gerek yoktu.","fx":["decoy"]}],"solution":"barlas","valid":["cop","muhur","sayac","otobus"],"explain":"Suçlu Barlas. Puanlar yalnızca Barlas ve Aysel'de bulunan fırça uçlu mor kalemle düzeltilmiş. Aysel'in setinin mührü sağlam, yani kalemi Barlas'ın seti. Jüri çöpünde Barlas'ın açılmış ambalajı çıktı; ‘çıkarmadım bile’ demesi yalan. Nilgün ve Tolga zaten başka yerdeydi.","decoyNote":"Leke öğrenci kaleminindi; yedek anahtara hiç gerek yoktu."},{"day":21,"level":"Orta","title":"Mahzenden Kaybolan Kaşar","place":"Çatak Yaylası Mandırası","rooms":["Mandıra","Peynir mahzeni","Ahır","Yayla yolu","Kantar rampası"],"hak":4,"mech":"alibi-saat","brief":"Çatak Yaylası Mandırası'nda mahzende olgunlaşan üç tekerlek kaşar sabah 07:00'de yoktu. Mahzen 05:45'te sayılmış, her şey yerindeymiş. Mahzenin tek giriş yolu mandıranın içinden geçiyor. Dört çalışanın ifadesi var.","suspects":[{"id":"ayse","name":"Ayşe","role":"Sağıcı","statement":"Sabah 05:30'dan 07:10'a kadar ahırda inekleri sağdım. Mahzene hiç inmedim."},{"id":"bekir","name":"Bekir","role":"Çoban","statement":"Sürüyü 05:30'da alıp otlağa çıkardım, öğlene kadar orada kaldım."},{"id":"cemile","name":"Cemile","role":"Mandıracı","statement":"06:10'da sütü kazana koydum ve 07:00'ye kadar kazanın başından ayrılmadım. Mahzene inmedim."},{"id":"davut","name":"Davut","role":"Süt nakliyecisi","statement":"Sabah erkenden aşağıdaki kantara indim, yükleme sırası bekledim. Mahzene uğramadım."}],"clues":[{"id":"kazan","title":"Süt kazanı","room":"Mandıra","icon":"alet","text":"Kazan kayıt kâğıdına göre süt 06:10'da ocağa konmuş. Kazan 06:50'de taşıp tabana yapışmış; ocağın altı 06:25'te kısılmış ve 06:45'e kadar kimse karıştırmamış. Mahzenin kapısı mandıranın arka köşesinde.","fx":["implicate:cemile"]},{"id":"sagim","title":"Sağım makinesi","room":"Ahır","icon":"kayit","text":"Sağım makinesinin sayacı 05:30'dan 07:10'a kadar her inek için kayıt almış. Kayıtlar Ayşe'nin kartıyla girilmiş ve hiçbir kayıt arası beş dakikayı geçmiyor. Ahır mandıradan yarım saat uzakta.","fx":["clear:ayse"]},{"id":"otlak","title":"Otlak çiti defteri","room":"Yayla yolu","icon":"defter","text":"Otlak bekçisi, sürünün 06:35'te çitten girdiğini yazmış ve Bekir'i adıyla anmış. Otlak mandıradan yayan bir saat uzakta.","fx":["clear:bekir"]},{"id":"kantar","title":"Kantar fişi","room":"Kantar rampası","icon":"fis","text":"Davut'un kamyonetinin fişi: 06:20'de boş tartılmış, 07:30'a kadar yükleme sırasında rampada beklemiş; rampa görevlisi imzalamış. Kantar mandıradan kırk dakikalık yol.","fx":["clear:davut"]},{"id":"canta","title":"Mahzen rafı","room":"Peynir mahzeni","icon":"kutu","text":"Mahzen rafında Bekir'in çoban çantası duruyor. Aynı çanta dünkü peynir sayım notunda da 'rafta' diye geçiyor; yani çanta peynirler kaybolmadan önce de oradaymış.","fx":["decoy"]}],"solution":"cemile","valid":["kazan","sagim","otlak","kantar"],"explain":"Suçlu Cemile. Ayşe sağım sayacıyla, Bekir otlak defteriyle, Davut kantar fişiyle olay anında mahzenden uzaktaydı. Cemile kazanın başından ayrılmadığını söylüyor, ama kazan 06:25-06:45 arası başsız kalmış ve mahzene giden tek yol mandıradan geçiyor. Bekir'in çantası peynirler kaybolmadan önce de rafta duruyordu.","decoyNote":"Çanta peynirlerden önce de oradaydı; yanıltıcıydı."},{"day":21,"level":"Zor","title":"Susan Siren","place":"Karaçam Gözetleme Kulesi","rooms":["Kule kabini","Alt kulübe","Patika","Odunluk","Bariyer"],"hak":5,"rule":true,"mech":"iz-yonu","brief":"Karlı bir gecede Karaçam Gözetleme Kulesi'nin yangın sirenini bağlayan kablo, odunluktaki sigorta kutusunda kesildi. Siren 01:45'te denendiğinde çaldı, 03:00'te çalmadı. Kar 00:30'da dindi. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: kabloyu kesen de o.","suspects":[{"id":"tamer","name":"Tamer","role":"Fidan işçisi","statement":"22:00'de alt kulübeye girdim ve sabaha kadar dışarı çıkmadım."},{"id":"ozlem","name":"Özlem","role":"Kule nöbetçisi","statement":"Gece kule kabininde nöbet tuttum. 01:45'te sireni denedim, çaldı. Ondan sonra kabinden hiç inmedim."},{"id":"kemal","name":"Kemal","role":"Doğa fotoğrafçısı","statement":"Vadideki çadırımda geceledim. Geceleyin kuleye çıkmadım."},{"id":"sevgi","name":"Sevgi","role":"Bariyer görevlisi","statement":"Gece boyunca park yolundaki bariyer kulübesinde nöbet tuttum."}],"clues":[{"id":"kulube","title":"Alt kulübe önü","room":"Alt kulübe","icon":"kapi","text":"Alt kulübenin kapısı ve penceresi önündeki kar, dindiği 00:30'dan beri hiç bozulmamış; tek bir iz yok.","fx":["clear:tamer"]},{"id":"patika","title":"Vadi patikası","room":"Patika","icon":"ayakizi","text":"Vadideki kamp yerine inen patikada, kar dindikten sonra ne yukarı ne aşağı tek bir ayak izi var. Yalnız bir tilkinin izi görülüyor.","fx":["clear:kemal"]},{"id":"bariyer","title":"Bariyer defteri","room":"Bariyer","icon":"defter","text":"Bariyer defterine her yarım saatte bir telsiz yoklaması yazılıp imzalanmış; 01:00'dan 03:30'a kadar satır atlanmamış, hepsi Sevgi'nin el yazısı. Bariyer kuleden üç kilometre uzakta, yürüyerek gidiş dönüş bir saati aşıyor.","fx":["clear:sevgi"]},{"id":"sigorta","title":"Sigorta kutusu","room":"Odunluk","icon":"kutu","text":"Kesik kablo odunluktaki sigorta kutusunda. Kule merdiveninin dibinden odunluğa giden tek sıra ayak izi var; aynı iz geri kule merdivenine dönüyor. İz kar dindikten sonra atılmış, başka yönden gelen iz yok.","fx":["implicate:ozlem"]},{"id":"telsiz","title":"Telsiz günlüğü","room":"Kule kabini","icon":"defter","text":"Telsiz günlüğü: 01:45 siren denemesi, çaldı. 03:00 siren denemesi, çalmadı. Arada iki saat boyunca günlüğe hiçbir not düşülmemiş.","fx":["context"]},{"id":"makas","title":"Fidan makası","room":"Alt kulübe","icon":"alet","text":"Alt kulübede Tamer'in fidan makası duruyor. Makasın ağzı tırtıklı ve körelmiş; sigorta kutusundaki kablonun kesiği ise düz, tek hamlede atılmış.","fx":["decoy"]},{"id":"tripod","title":"Kamera tripodu","room":"Patika","icon":"kamera","text":"Patika başında Kemal'in tripodu ve kamerası duruyor. Üstünde parmak kalınlığında kar birikmiş; kar 00:30'da dindi.","fx":["decoy"]}],"solution":"ozlem","valid":["kulube","patika","bariyer","sigorta"],"explain":"Suçlu Özlem. Kar 00:30'da dindiği için Tamer'in kapısı ve vadi patikası bozulmamış; Tamer ve Kemal dışarı çıkmadı, Sevgi de bariyerde saat saat imzalıydı. Kabloya giden tek iz kule merdiveninden başlıyor ve oraya dönüyor, oysa Özlem kabinden inmediğini söylemişti. Makasın ağzı tırtıklı, kesik düz; tripod gece boyu yerinden oynamamıştı.","decoyNote":"Makas kesiğe uymuyor, tripod oynamamıştı; ikisi yanıltıcıydı."},{"day":22,"level":"Orta","title":"Soyunma Salonu Hırsızı","place":"Kaynarca Termal Tesisi","rooms":["Soyunma salonu","Havuz","Masaj odası","Resepsiyon"],"hak":4,"mech":"sistem-kaydi","brief":"Kaynarca Termal Tesisi'nde bir misafirin altın bileziği, 15:00 ile 15:40 arasında soyunma salonundaki 14 numaralı dolaptan alındı. Dolap kilidi zorlanmamış. Salona personel kapısından da girilebiliyor. Dört çalışanın ifadesi var.","suspects":[{"id":"sinan","name":"Sinan","role":"Cankurtaran","statement":"Öğleden sonra boyunca havuz kenarından ayrılmadım, soyunma salonuna girmedim."},{"id":"hulya","name":"Hülya","role":"Masöz","statement":"14:30'dan 16:00'ya kadar masaj odasında çalıştım."},{"id":"ercan","name":"Ercan","role":"Resepsiyonist","statement":"Öğleden sonra boyunca tezgâhta rezervasyon girdim."},{"id":"nese","name":"Neşe","role":"Temizlik görevlisi","statement":"15:00'ten sonra çamaşırhanede havlu katladım."}],"clues":[{"id":"kart","title":"Personel kapısı okuyucusu","room":"Havuz","icon":"kayit","text":"Havuz kenarındaki personel kapısı okuyucusu, 15:12'de Cankurtaran kartıyla soyunma salonu yönüne giriş, 15:19'da çıkış kaydetmiş. Kart zimmet defterinde Sinan'a ait ve kimseye ödünç verilmemiş.","fx":["implicate:sinan"]},{"id":"seans","title":"Randevu defteri","room":"Masaj odası","icon":"defter","text":"Hülya'nın misafiri 14:45'ten 15:55'e kadar seansta. Oda kapısı seans boyunca içeriden kilitli kalmış, Hülya'nın seans notları beş dakikalık aralıklarla yazılmış.","fx":["clear:hulya"]},{"id":"bilgisayar","title":"Rezervasyon kaydı","room":"Resepsiyon","icon":"kayit","text":"Resepsiyon bilgisayarında 15:00-15:40 arasında Ercan'ın şifresiyle her üç dört dakikada yeni rezervasyon girilmiş; en uzun ara dört dakika. Resepsiyondan soyunma salonuna gidiş dönüş yürüyerek en az on dakika.","fx":["clear:ercan"]},{"id":"kamera","title":"Çamaşırhane kamerası","room":"Resepsiyon","icon":"kamera","text":"Resepsiyondaki güvenlik ekranı, çamaşırhane kamerasının 15:00-15:45 kaydını saklıyor: Neşe katlama masasında, kareler kesintisiz.","fx":["clear:nese"]},{"id":"araba","title":"Temizlik arabası","room":"Soyunma salonu","icon":"alet","text":"14 numaralı dolabın yanında Neşe'nin temizlik arabası duruyor. Arabanın üstündeki etikette 'dolap önü silindi 14:30' yazıyor; araba hırsızlıktan önce oraya bırakılmış.","fx":["decoy"]}],"solution":"sinan","valid":["kart","seans","bilgisayar","kamera"],"explain":"Suçlu Sinan. Hülya seans odasında, Ercan rezervasyon girerken, Neşe çamaşırhane kamerasında olduğu için hırsızlık saatinde salona gidemezdi. Sinan havuz kenarından hiç ayrılmadığını söylüyor, ama personel kapısı kaydı 15:12'de kartıyla salona girdiğini gösteriyor. Temizlik arabası hırsızlıktan önce oradaydı.","decoyNote":"Araba hırsızlıktan önce bırakılmıştı; yanıltıcıydı."},{"day":22,"level":"Zor","title":"Adı Konmayan Bitki","place":"Sultansazı Botanik Bahçesi","rooms":["Sera 2","Sera 1","Ana kapı","Müdür odası","Servis durağı"],"hak":5,"rule":true,"mech":"imkansiz-bilgi","brief":"Botanik bahçesinin Sera 2'sinden değerli bir bitki 05:30 ile 06:00 arasında alındı: kapı mührü 05:30 turunda sağlam, 06:00 turunda kırıktı. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: bitkiyi alan da o.","suspects":[{"id":"rabia","name":"Rabia","role":"Bahçıvan","statement":"05:00'den 06:30'a kadar Sera 1'de sulama yaptım, başka yere gitmedim."},{"id":"yilmaz","name":"Yılmaz","role":"Güvenlik görevlisi","statement":"Gece boyunca ana kapıdaydım. Sabaha karşı gelen tedarik kamyonunu karşıladım."},{"id":"dilek","name":"Dilek","role":"Rehber","statement":"Şehirden ilk servisle geldim, bahçeye 06:25 gibi vardım."},{"id":"atilla","name":"Dr. Atilla","role":"Misafir araştırmacı","statement":"Dün akşam 18:00'de çıktım, bu sabah 08:40'ta geldim ve doğrudan laboratuvara geçtim. Kimseyle konuşmadım; kaybolan orkideyle de ilgim yok."}],"clues":[{"id":"sulama","title":"Sulama panosu","room":"Sera 1","icon":"kayit","text":"Sulama panosu: 05:00'dan 06:00'ya kadar on iki vana sırayla, her biri beş dakikalık elle açılmış; hepsi Rabia'nın kartıyla. Sera 1, Sera 2'ye sekiz dakikalık yol.","fx":["clear:rabia"]},{"id":"kamyon","title":"Teslim fişleri","room":"Ana kapı","icon":"fis","text":"Tedarik kamyonunun teslim fişleri 05:35, 05:50 ve 06:00'da Yılmaz tarafından ana kapıda imzalanmış. Ana kapı Sera 2'ye on beş dakikalık yürüyüş.","fx":["clear:yilmaz"]},{"id":"servis","title":"Servis kartı kaydı","room":"Servis durağı","icon":"kayit","text":"Şehir servisi kaydı: Dilek'in kartı 05:20'de şehir meydanından okutulmuş. Servis ilk durağa 06:15'te varıyor ve bahçe kapısında 06:25'te indiriyor.","fx":["clear:dilek"]},{"id":"tutanak","title":"Toplantı tutanağı","room":"Müdür odası","icon":"dosya","text":"08:00 toplantı tutanağı: Müdür personele yalnızca 'Sera 2'den bir bitki eksik' demiş; türünü kimseye söylememiş, hiçbir yere yazmamış. Atilla toplantı bittikten sonra 08:40'ta gelmiş, laboratuvarda yalnız kalmış. Gece bahçeden uzakta olduğunu gösteren hiçbir kayıt yok.","fx":["implicate:atilla"]},{"id":"iz","title":"Sera 2 çamuru","room":"Sera 2","icon":"ayakizi","text":"Sera 2 kapısının yanındaki çamurda Rabia'nın çizmesine benzer bir iz var. İzin içi kurumuş ve çatlamış, kenarlarında dünkü yağmurun kum tanecikleri duruyor.","fx":["decoy"]},{"id":"zarf","title":"Yedek anahtar","room":"Ana kapı","icon":"anahtar","text":"Güvenlik kulübesinin çekmecesinde Sera 2'nin yedek anahtarı duruyor. Anahtar mühürlü bir zarfın içinde ve zarfın mührü sağlam.","fx":["decoy"]}],"solution":"atilla","valid":["sulama","kamyon","servis","tutanak"],"explain":"Suçlu Dr. Atilla. Rabia vanaları sırayla açtığı, Yılmaz teslim fişlerini imzaladığı, Dilek şehirde servis kartı okuttuğu için aklandı. Müdür bitkinin türünü kimseye söylememişti; Atilla toplantıda yoktu ve kimseyle konuşmadığını söylüyor. Yine de kaybolanın orkide olduğunu biliyor: bunu ancak bitkiyi alan bilebilir. İz eskiydi, zarf mühürlüydü.","decoyNote":"İz eskiydi, anahtar zarfı mühürlüydü; yanıltıcıydı."},{"day":23,"level":"Orta","title":"Dördüncü Anahtar","place":"Söğütdere At Çiftliği","rooms":["Ofis","Yem deposu","Doğum ahırı","Veteriner kliniği","Sağlık ocağı"],"hak":4,"mech":"eksik-parca","brief":"Söğütdere At Çiftliği'nde 23:00'te sayılan yirmi çuval arpa, sabah 05:30'da yem deposunda yoktu. Depo kilidi zorlanmamış. Deponun üç anahtarı vardı ve üçü de sabah sayımında yerinde çıktı. Dört çalışanın ifadesi var.","suspects":[{"id":"murat","name":"Murat","role":"Ahırbaşı","statement":"Anahtarım hep zincirimde durur. Gece boyunca kısrağın doğumunda ahırdaydım."},{"id":"ferit","name":"Ferit","role":"At bakıcısı","statement":"Depo benim işim değil, anahtarıyla da ilgim olmadı. Geceyi odamda uyuyarak geçirdim."},{"id":"selma","name":"Selma","role":"Yemci","statement":"Gece kızımı sağlık ocağına götürdüm, sabaha kadar bekledim."},{"id":"gonca","name":"Gonca","role":"Veteriner","statement":"Gece şehirde acil bir vakaya gittim, sabaha karşı döndüm."}],"clues":[{"id":"cilingir","title":"Çilingir fişi","room":"Ofis","icon":"fis","text":"Ofis çöpünde çilingir fişi bulundu: 'Çiftlik deposu kilidi, bir kopya anahtar, teslim alan: F. Yıldırım, tarih: bir gün önce.' Çiftlikte F. Yıldırım adlı tek kişi var: Ferit.","fx":["implicate:ferit"]},{"id":"defter","title":"Depo defteri","room":"Ofis","icon":"defter","text":"Depo defterinde 'Selma, gece 01:30, depo açıldı' satırı var. Diğer tüm satırlar mürekkeple yazılmış; bu satır kurşun kalemle, sayfa kenarına sığdırılmış ve tarihi yok.","fx":["decoy"]},{"id":"tekerlek","title":"Depo önü","room":"Yem deposu","icon":"ayakizi","text":"Depo önünde Murat'ın römorkunun tekerlek izi var. İzin içi yağmurla dolmuş ve kenarları çökmüş; yağmur 22:00'de dindi.","fx":["decoy"]},{"id":"dogum","title":"Doğum nöbet defteri","room":"Doğum ahırı","icon":"defter","text":"Doğum nöbet defterinde Murat 22:50'den 05:30'a kadar kısrağın başında her on dakikada bir imza atmış; satır atlanmamış. Ahır depodan beş dakikalık yol.","fx":["clear:murat"]},{"id":"arac","title":"Klinik araç defteri","room":"Veteriner kliniği","icon":"arac","text":"Kliniğin araç defteri: Gonca'nın aracı 22:45'te şehir yönüne çıkmış; şehir kırk kilometre, yaklaşık bir saatlik yol. Şehir hastanesi acil kaydında Gonca 23:30'dan 04:50'ye kadar vakada imzalı.","fx":["clear:gonca"]},{"id":"ocak","title":"Sağlık ocağı kaydı","room":"Sağlık ocağı","icon":"kayit","text":"İlçe sağlık ocağı kaydı: Selma ve kızı 23:10'da gelmiş, kız 05:50'ye kadar serumda kalmış; refakatçi Selma her yarım saatte hemşire çizelgesini imzalamış. Ocak çiftlikten yirmi kilometre uzakta.","fx":["clear:selma"]}],"solution":"ferit","valid":["cilingir","dogum","arac","ocak"],"explain":"Suçlu Ferit. Murat doğum nöbetinde, Gonca şehirdeki acil vakada, Selma sağlık ocağında imzalıydı; üçü de gece depoya gidemezdi. Üç anahtar yerindeydi, yani depo dördüncü bir anahtarla açılmış. Çilingir fişi Ferit'e kopya yapıldığını gösteriyor, oysa anahtarla ilgisi olmadığını söylemişti. Defter satırı sonradan eklenmişti, tekerlek izi yağmurdan önceydi.","decoyNote":"Defter satırı sonradan eklenmiş, iz yağmurdan önceydi; yanıltıcıydı."},{"day":23,"level":"Zor","title":"Eksik Kırk Kilo","place":"Çamlıbel Arıcılık Tesisi","rooms":["Depo","Kantar","Kovanlık","Kooperatif ofisi","Festival standı"],"hak":5,"rule":true,"mech":"kayit-celiskisi","brief":"Çamlıbel Arıcılık Tesisi'nde Cuma 18:00'de depoda 160 kg bal sayıldı. Cumartesi sabahı kamyonet yüklenip mühürlendi ve festival standına gitti; teslim tutanağında 120 kg yazıyordu. Kırk kilo bal çalındı. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: balı alan da o.","suspects":[{"id":"tuncay","name":"Tuncay","role":"Depo sorumlusu","statement":"Cuma akşamı 160 kg balı sayıp depoyu kilitledim. Cumartesi sabahı yüklemeyi başından sonuna sayarak izledim, hepsi yüklendi."},{"id":"ramis","name":"Ramis","role":"Nakliyeci","statement":"Kasa mühürlenir mühürlenmez kantara gittim, hiç durmadım. Kasayı açmadım, ne yüklendiyse onu teslim ettim."},{"id":"selahattin","name":"Selahattin","role":"Arıcı","statement":"Cuma akşamından Cumartesi sabahına kadar kovanlıkta nöbet tuttum, depoya uğramadım."},{"id":"gulay","name":"Gülay","role":"Muhasebeci","statement":"Cuma akşamı şehre gittim, Cumartesi sabahı ilk otobüsle döndüm."}],"clues":[{"id":"fis","title":"Çıkış fişi","room":"Depo","icon":"fis","text":"Depo defterinde Cuma 18:00 sayımı 160 kg. Cumartesi çıkış fişi 160 kg, 07:10'da Tuncay tarafından imzalanmış; kasa 07:12'de depoda 4471 numaralı mühürle kapatılmış.","fx":["context"]},{"id":"kantar","title":"Kantar fişi","room":"Kantar","icon":"fis","text":"Kantar fişi: kamyonet 07:20'de net 120 kg bal ile tartılmış; kasanın 4471 numaralı mührü kantarda sağlam görülüp fişe işlenmiş. Fişe iliştirilmiş yükleme sayım kâğıdında 12 bidon yazıyor (bidon 10 kg) ve altında Tuncay'ın el yazısı ile imzası var.","fx":["implicate:tuncay"]},{"id":"kovanlik","title":"Kovanlık kamerası","room":"Kovanlık","icon":"kamera","text":"Kovanlık gece kamerası: Cuma 18:00'den Cumartesi 07:30'a kadar Selahattin kovan başında nöbet çizelgesini her yarım saatte imzalamış, hepsi görüntüde. Kovanlık depoya iki kilometre, yürüyerek yarım saat.","fx":["clear:selahattin"]},{"id":"bilet","title":"Otobüs bileti kaydı","room":"Kooperatif ofisi","icon":"kayit","text":"Şehir hattı kaydı: Gülay Cuma 17:45'te şehre gidiş, Cumartesi 08:00'de dönüş biletini kullanmış. Şehir tesisten elli kilometre; gece seferi yok.","fx":["clear:gulay"]},{"id":"tutanak","title":"Teslim tutanağı","room":"Festival standı","icon":"dosya","text":"Standa teslimde 4471 numaralı mühür sağlam kesilmiş, içeride 120 kg sayılmış. Kamyonetin yol kamerası depodan standa kadar hiç durmadığını gösteriyor.","fx":["clear:ramis"]},{"id":"bidon","title":"Kamyonet kasası","room":"Festival standı","icon":"kutu","text":"Kamyonetin kasasında boş bir bidon ve kurumuş, şekerlenmiş bal lekesi var. Bidonun etiketinde geçen yılın hasat tarihi yazılı.","fx":["decoy"]},{"id":"kavanoz","title":"Gülay'ın masası","room":"Kooperatif ofisi","icon":"kutu","text":"Gülay'ın masasında beş boş bal kavanozu duruyor. Hepsi 250 gramlık numune kavanozu; beşinin toplamı 1,25 kilo.","fx":["decoy"]}],"solution":"tuncay","valid":["kantar","kovanlik","bilet","tutanak"],"explain":"Suçlu Tuncay. Aynı numaralı mühür depoda vurulmuş, kantarda ve standda sağlam çıkmış; kamyonet yolda durmamış. Yani kırk kilo kasaya hiç girmedi. Ramis mührü açmadı, Selahattin kameradaydı, Gülay şehirdeydi. Tuncay hepsinin yüklendiğini söylüyor ve fişe 160 yazmış, oysa kendi imzalı yükleme sayım kâğıdında 12 bidon (120 kg) var. Bidon eski, kavanozlar 1,25 kiloydu.","decoyNote":"Bidon eski, kavanozlar sadece 1,25 kilo; ikisi de yanıltıcıydı."},{"day":24,"level":"Orta","title":"Soğuk Odanın Sessizliği","place":"Asmalı Bağ Evi","rooms":["Soğuk oda","Mutfak odası","Veranda","Köy yolu"],"hak":4,"mech":"kokunun-izi","brief":"Asmalı Bağ Evi'nde kırk kasa üzüm soğuk odada bekliyordu. Soğutma 22:40'ta durdu ve sabah üzümler bozulmuş çıktı. Soğutma, pano kapağı açılıp şalter indirilerek kapatılmış. Dört çalışanın ifadesi var.","suspects":[{"id":"gulten","name":"Gülten","role":"Aşçı","statement":"22:00'den sonra odama çekildim ve kapıyı sürgüledim."},{"id":"isik","name":"Işık","role":"Mahzenci","statement":"Soğuk odayı 22:30'da kontrol ettim, her şey yolundaydı. Sonra köy servisine bindim."},{"id":"ekrem","name":"Ekrem","role":"Üzüm tüccarı","statement":"Akşam boyunca verandada telefonla konuştum."},{"id":"haydar","name":"Haydar","role":"Traktör ustası","statement":"Traktörü garaja çektikten sonra doğrudan lojmana gittim. Soğuk oda tarafına yaklaşmadım."}],"clues":[{"id":"pano","title":"Şalter panosu","room":"Soğuk oda","icon":"alet","text":"Şalter panosunun beyaz plastik kapağında taze gres lekesi ve gres kokusu var. Bağ evinde gres yalnız garajda, traktör bakımında kullanılıyor ve garajda yalnız Haydar çalışıyor.","fx":["implicate:haydar"]},{"id":"sarimsak","title":"Pano başı","room":"Soğuk oda","icon":"kutu","text":"Panonun başında keskin sarımsak kokusu var. Panonun hemen üstündeki kirişten kurutulmuş sarımsak çelengi sarkıyor.","fx":["decoy"]},{"id":"surgu","title":"Aşçı odası","room":"Mutfak odası","icon":"kilit","text":"Gülten'in odası zemin katta, penceresi demir parmaklıklı. Kapı sabah 06:00'a kadar içeriden sürgülü kalmış; bahçıvan kapıya vurup onu uyandırmış.","fx":["clear:gulten"]},{"id":"telefon","title":"Telefon kaydı","room":"Veranda","icon":"telefon","text":"Ekrem'in telefon kaydı: 22:35'te başlayan görüşme 23:45'e kadar kesintisiz sürmüş. Veranda kamerası da aynı saatlerde onu koltukta gösteriyor.","fx":["clear:ekrem"]},{"id":"servis","title":"Servis yolcu listesi","room":"Köy yolu","icon":"arac","text":"Köy servisi yolcu listesi: Işık 22:35'te bağ kapısından binmiş, köyde 23:10'da inmiş. Servis bağ evine bir daha dönmemiş.","fx":["clear:isik"]}],"solution":"haydar","valid":["pano","surgu","telefon","servis"],"explain":"Suçlu Haydar. Gülten sürgülü odasında, Ekrem verandada telefonda, Işık köy servisinde olduğundan soğutmayı kesemezdi. Panonun kapağındaki gres yalnız garajdan gelir ve garajda yalnız Haydar çalışır; o ise soğuk oda tarafına yaklaşmadığını söylemişti. Sarımsak kokusu pano üstündeki çelenkten geliyordu.","decoyNote":"Koku, üstteki sarımsak çelengindendi; yanıltıcıydı."},{"day":24,"level":"Zor","title":"Ateş Başı Şahitleri","place":"Kızılçam Kamp Alanı","rooms":["Ateş başı","Kasa kulübesi","Çadır alanı","Otopark","Güvenlik kulübesi"],"hak":5,"rule":true,"mech":"ortak-mazeret","brief":"Kızılçam Kamp Alanı'nın giriş kulübesindeki kasadan 02:00 ile 02:30 arasında günün nakit geliri alındı. Kasa kilidi anahtarla açılmış. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: parayı alan da o.","suspects":[{"id":"bora","name":"Bora","role":"Gece bekçisi","statement":"00:30'dan 03:00'e kadar ateş başı nöbetindeydim. Kader'le sohbet ettik ama o 02:00'de ilacını almaya gidip 02:40'ta döndü."},{"id":"tolga","name":"Tolga","role":"Kampçı","statement":"01:00'de çadırımı içeriden fermuarlayıp yattım, sabaha kadar çıkmadım."},{"id":"kader","name":"Kader","role":"Kamp rehberi","statement":"01:30'dan 03:00'e kadar ateş başında Bora'yla oturduk. İkimiz de yerimizden hiç kalkmadık."},{"id":"selin","name":"Selin","role":"Kantin işletmecisi","statement":"Kantini 01:00'de kapatıp arabamla ilçedeki evime gittim."}],"clues":[{"id":"nobet","title":"Nöbet çizelgesi","room":"Ateş başı","icon":"defter","text":"Ateş başındaki nöbet çizelgesi: Bora odun ekleyip her on dakikada bir imza atmış. 01:30'dan 03:00'e kadar hiçbir satır atlanmamış. Ateş başı kasa kulübesine on dakikalık yürüyüş.","fx":["clear:bora"]},{"id":"kamera","title":"Güvenlik kamerası","room":"Güvenlik kulübesi","icon":"kamera","text":"Ateş başını gören güvenlik kamerası, 02:00'den 02:40'a kadar yalnız Bora'yı gösteriyor. Bora yanında kimse olmadan odun ekliyor. 02:40'ta Kader gelip yanındaki sandalyeye oturuyor.","fx":["implicate:kader"]},{"id":"cadir","title":"Çadır fermuarı","room":"Çadır alanı","icon":"kilit","text":"Tolga'nın çadırı içeriden fermuarlı; fermuar çekicisi çadırın içinde bir bağcıkla direğe düğümlenmiş. Bağcık sabah 06:30'da bağlı bulundu, düğümü bozulmamış; çadırın başka girişi yok.","fx":["clear:tolga"]},{"id":"bariyer","title":"Bariyer kaydı","room":"Otopark","icon":"arac","text":"Otopark bariyer kaydı: Selin'in aracı 01:05'te çıkış, sabah 07:30'da giriş yapmış. Gece boyunca başka giriş çıkış yok. İlçe yirmi kilometre uzakta.","fx":["clear:selin"]},{"id":"iz","title":"Kulübe önü","room":"Kasa kulübesi","icon":"ayakizi","text":"Kasa kulübesinin önünde Tolga'nın bota benzeyen bir iz var. İzin içi yağmurla dolmuş, kenarları çökmüş; yağmur gece 22:00'de dindi.","fx":["decoy"]},{"id":"kase","title":"Kasa içi","room":"Kasa kulübesi","icon":"kutu","text":"Kasanın içinde Selin'in kantin kaşesi duruyor. Kantin geliri her akşam aynı kasaya yatırıldığı için kaşe rutin olarak orada tutuluyor.","fx":["decoy"]}],"solution":"kader","valid":["nobet","kamera","cadir","bariyer"],"explain":"Suçlu Kader. Ateş başında hiç kalkmadığını söylüyor, ama güvenlik kamerası 02:00-02:40 arasında Bora'yı tek başına gösteriyor; Bora'nın ifadesi doğru. Bora'nın nöbet çizelgesi, Tolga'nın bağlı çadırı ve Selin'in bariyer kaydı diğerlerini aklıyor. İz yağmurdan önceydi, kaşe zaten kasada dururdu.","decoyNote":"İz yağmurdan önceydi, kaşe zaten kasadaydı; yanıltıcıydı."},{"day":25,"level":"Orta","title":"Kuyu Başındaki Kutu","place":"Dumanlı Yayla Evi","rooms":["Ev salonu","Bahçe kuyusu","Ahır","Mutfak","Misafir odası"],"hak":4,"mech":"yer-degisimi","brief":"Dumanlı Yayla Evi'nde ev sahibinin emanet altın bileziği, masadaki kutusuyla kayboldu. Boş kutu 05:00'te kuyu başında bulundu; ev sahibi 04:00'te oradan geçmiş ve kutu yokmuş. Sanki hırsız dışarıdan gelmiş gibi duruyor. Dört kişinin ifadesi var.","suspects":[{"id":"mehmet","name":"Mehmet","role":"Çoban","statement":"Gece koyunun doğumu için ahırdaydım, sabaha kadar başından ayrılmadım."},{"id":"ayten","name":"Ayten","role":"Gelin","statement":"Gece boyunca salonda kitap okudum, hiç dışarı çıkmadım."},{"id":"zeynep","name":"Zeynep","role":"Aşçı","statement":"Gece mutfakta ekmek yaptım, sabaha kadar fırının başındaydım."},{"id":"kadir","name":"Kadir","role":"Yürüyüşçü misafir","statement":"Odama çekilip kapıyı sürgüledim, sabaha kadar uyudum."}],"clues":[{"id":"kuyu","title":"Kuyu başı","room":"Bahçe kuyusu","icon":"kutu","text":"Boş kutu kuyu başındaki taşın üstünde. Taş ve çevredeki toprak ıslak; kutunun dışı ve içi ise kuru, üstünde yağmur izi yok. Yağmur gece 03:00'te dinmiş. Kutu yağmur bittikten sonra konmuş; ev sahibi 04:00'te görmediğine göre 04:00 ile 05:00 arasında.","fx":["context"]},{"id":"bot","title":"Kuyu çevresi","room":"Bahçe kuyusu","icon":"ayakizi","text":"Kuyu çevresinde yürüyüşçü botu profiline benzeyen bir iz var. İzin içi yağmurla dolmuş, kenarları çökmüş.","fx":["decoy"]},{"id":"paspas","title":"Salon kapısı","room":"Ev salonu","icon":"kapi","text":"Salonun dış kapısı 02:00'de kilitlenmiş; anahtar yalnız Ayten'de. Kapının iç paspasında ıslak çim parçaları ve kuyu başında biten sarı yayla çiçeğinin taç yaprağı var. Paspas 02:00'de silinmişti.","fx":["implicate:ayten"]},{"id":"video","title":"Veteriner görüşmesi","room":"Ahır","icon":"telefon","text":"Veteriner video görüşme kaydı: Mehmet 03:50'den 05:10'a kadar koyunun doğumunu kameradan göstermiş, görüşme kesintisiz. Kamera açısı hep Mehmet'i gösteriyor.","fx":["clear:mehmet"]},{"id":"firin","title":"Fırın çizelgesi","room":"Mutfak","icon":"saat","text":"Fırın başındaki çizelge: Zeynep 03:30'dan 05:10'a kadar her on dakikada bir ekmeği çevirip saatini yazmış; boşluk yok. Mutfak kuyuya sekiz dakikalık yol.","fx":["clear:zeynep"]},{"id":"surgu","title":"Misafir odası","room":"Misafir odası","icon":"kilit","text":"Misafir odasının kapısı 06:30'a kadar içeriden sürgülü bulundu. Pencere de sürgülü ve pervazda hiç iz yok.","fx":["clear:kadir"]}],"solution":"ayten","valid":["paspas","video","firin","surgu"],"explain":"Suçlu Ayten. Mehmet video kaydında, Zeynep ekmek çizelgesinde, Kadir sürgülü odasında olduğundan 04:00-05:00 arasında kuyuya gidemezdi. Kutu kuru, taş ıslak olduğundan yağmur dindikten sonra, ev sahibi 04:00'te görmediği için 04:00-05:00 arasında kuyuya bırakıldı. Salonun dış kapısı kilitliydi ve anahtar Ayten'deydi; paspastaki ıslak çim ve kuyu çiçeği onun dışarı çıktığını gösteriyor. Bot izi yağmurdan öncesine aitti.","decoyNote":"Bot izi yağmurla dolmuştu, yani eskiydi; yanıltıcıydı."},{"day":25,"level":"Zor","title":"Dağ Evinin Geç Saati","place":"Ayıdağı Dağ Evi","rooms":["Salon","Mutfak","Kayak odası","Üst kat koridoru","Bodrum sauna"],"hak":5,"rule":true,"mech":"sahte-alibi","brief":"Ayıdağı Dağ Evi'nde misafir Orhan Bey'in antika pusulası, 21:15 ile 21:45 arasında salondaki vitrinden alındı. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: pusulayı alan da o.","suspects":[{"id":"nalan","name":"Nalan","role":"Ev sahibi","statement":"21:00'den 22:00'ye kadar mutfakta çorba ve ekmek hazırladım."},{"id":"selcuk","name":"Selçuk","role":"Misafir","statement":"20:40'tan 22:00'ye kadar bodrumdaki saunadaydım. 21:30'da çektiğim fotoğraf telefonumda duruyor."},{"id":"vedat","name":"Vedat","role":"Kayak eğitmeni","statement":"21:00'den 22:00'ye kadar kayak odasında bağları yağladım."},{"id":"meltem","name":"Meltem","role":"Doğa fotoğrafçısı","statement":"21:00 sularında odama çıkıp kapıyı kilitledim, 22:00'den sonra indim."}],"clues":[{"id":"telefon","title":"Sauna rafı","room":"Bodrum sauna","icon":"telefon","text":"Sauna kapısı önündeki rafta Selçuk'un telefonu duruyor. Ekranda 21:30 damgalı bir sauna fotoğrafı var. Telefonun saati elle ayarlanmış; Nalan'ın 21:52'de gönderdiği mesaj telefonda 21:26 görünüyor.","fx":["implicate:selcuk"]},{"id":"telsiz","title":"Bebek telsizi","room":"Mutfak","icon":"kayit","text":"Üst kattaki torun için açık bırakılan telsiz, 21:00'den 22:00'ye kadar mutfaktaki sesleri kesintisiz kaydetmiş: tencere, kepçe ve Nalan'ın söylediği şarkı hiç kesilmemiş.","fx":["clear:nalan"]},{"id":"kayakkamera","title":"Kayak odası kamerası","room":"Kayak odası","icon":"kamera","text":"Kayak odasının kapı kamerası 21:00'den 22:00'ye kadar Vedat'ı tezgâhta kesintisiz gösteriyor. Odanın tek kapısı bu kapı.","fx":["clear:vedat"]},{"id":"dijital","title":"Oda kapısı kilidi","room":"Üst kat koridoru","icon":"kilit","text":"Meltem'in oda kapısındaki dijital kilit 20:55'te kilitlenmiş, bir sonraki açılış 22:10. Arada kilit hiç çalıştırılmamış; pencere sürgülü ve dışarıdaki kar bozulmamış.","fx":["clear:meltem"]},{"id":"mum","title":"Vitrin yanı","room":"Salon","icon":"goz","text":"Vitrinin yanındaki halıda mavi kayak mumu damlası var. Hemen yanındaki kurutma standında dün akşamdan kalma mavi mumlu iki kayak duruyor.","fx":["decoy"]},{"id":"pirinc","title":"Mutfak rafı","room":"Mutfak","icon":"kutu","text":"Mutfak rafında pirinç bir pusula duruyor. Kapağında 'Nalan'a, 1998' kazılı; çalınan pusulanın kapağı ise düz ve yazısız.","fx":["decoy"]}],"solution":"selcuk","valid":["telefon","telsiz","kayakkamera","dijital"],"explain":"Suçlu Selçuk. Nalan telsiz kaydında, Vedat kamerada, Meltem kilitli odasında olduğundan 21:15-21:45 arasında salona gidemezdi. Selçuk saunadaki 21:30 fotoğrafını mazeret gösteriyor, ama telefonunun saati 26 dakika geri alınmış: fotoğraf gerçekte 21:56'da çekilmiş. Mum damlası standdan, pirinç pusula Nalan'ın kendi hediyesiydi.","decoyNote":"Mum standdan damlamış, pirinç pusula başkasının; yanıltıcıydı."},{"day":26,"level":"Orta","title":"Üçüncü Anahtar","place":"Nehir Biyokimya Laboratuvarı","rooms":["Soğuk oda","Analiz salonu","Kabul masası","Koridor","Ofis"],"hak":4,"mech":"eksik-parca","brief":"Nehir Biyokimya Laboratuvarı'nda cuma akşamı soğuk odadaki E-7 enzim şişesi kayboldu. Şişe 17:30 sayımında yerindeydi, 18:30'da yoktu. Soğuk oda yalnızca anahtarla açılıyor ve kayıtlara göre iki anahtar var.","suspects":[{"id":"selma","name":"Selma","role":"Stajyer","statement":"17:30'dan sonra kabul masasında numune kaydı girdim. Yerimden kalkmadım."},{"id":"levent","name":"Levent","role":"Laborant","statement":"Akşam boyunca analiz salonunda cihazları kalibre ettim. Soğuk odanın anahtarı bende hiç olmadı."},{"id":"orhan","name":"Orhan","role":"Temizlik görevlisi","statement":"17:15'ten beri üst kat ofislerini temizliyorum. Aşağı katta işim yok."},{"id":"pinar","name":"Dr. Pınar","role":"Lab şefi","statement":"17:20'den 19:00'a kadar şehir merkezindeki yönetim toplantısındaydım. Anahtarım yanımdaydı."}],"clues":[{"id":"kopya","title":"Çilingir makbuzu","room":"Ofis","icon":"fis","text":"Ofis dosyasında üç ay önceki bir makbuz var. Soğuk oda anahtarından kayıtlı iki kopya yerine üç kopya çıkarılmış. Üçüncü kopyanın teslim satırını Levent K. imzalamış.","fx":["implicate:levent"]},{"id":"kabul","title":"Kabul defteri","room":"Kabul masası","icon":"defter","text":"17:35'ten 18:35'e kadar her 4-5 dakikada bir numune girişi var, hepsi Selma'nın el yazısı ve parafıyla. Soğuk oda zemin katın öbür ucunda; gidiş dönüş en az 8 dakika sürer.","fx":["clear:selma"]},{"id":"kat","title":"Kat kapısı kaydı","room":"Koridor","icon":"kapi","text":"Zemin kat ile üst kat arasındaki çelik kapı 17:00'de kilitlenir. Güvenlik kaydına göre Orhan 17:15'te üst kata çıkmış, 19:00'da kapıyı açtırarak inmiş. Arada kapı hiç açılmamış.","fx":["clear:orhan"]},{"id":"toplanti","title":"Toplantı tutanağı","room":"Ofis","icon":"dosya","text":"Şehir merkezindeki yönetim toplantısının tutanağında Dr. Pınar 17:20'de katılmış, 19:00'da çıkmış görünüyor. Tutanağı üç yönetici imzalamış.","fx":["clear:pinar"]},{"id":"paspas","title":"Zemin izi","room":"Soğuk oda","icon":"ayakizi","text":"Soğuk oda önündeki zeminde ıslak paspas izi ve temizlik arabasının tekerlek izi var. Zemin bakım defterine göre bu koridor 16:30'da silinmiş.","fx":["decoy"]},{"id":"kalib","title":"Kalibrasyon raporu","room":"Analiz salonu","icon":"kayit","text":"Cihaz 17:30'da kalibrasyona başlamış ve 18:05'te bitirmiş. Bir sonraki ölçüm 18:25'te başlamış. Arada rapor boş.","fx":["context"]}],"solution":"levent","valid":["kopya","kabul","kat","toplanti"],"explain":"Suçlu Levent. Soğuk oda anahtarının kayıtlı iki kopyası dışında üçüncü bir kopya çıkarılmış ve teslim satırında Levent'in imzası var; oysa o, anahtarın bende hiç olmadığını söylemişti. Selma 5 dakikayı aşan bir süre masadan ayrılamazdı, Orhan kilitli kat kapısının üst tarafındaydı, Dr. Pınar toplantıdaydı. Paspas izi 16:30'dan kalmaydı, kayıptan önceydi.","decoyNote":"Paspas izi 16:30'da silinen koridordan kalmıştı; kayıptan önceydi."},{"day":26,"level":"Zor","title":"Kasa Dairesi Kaydı","place":"Demirkent Banka Şubesi","rooms":["Kasa dairesi","Gişe","Müdür odası","Giriş holü","Otopark"],"hak":5,"rule":true,"mech":"sistem-kaydi","brief":"Demirkent Banka Şubesi'nde kapanışta kasa dairesindeki 8.000 TL'lik paket eksik çıktı. Paket 17:50'de sayılıp yerine konmuş, 18:10'da yoktu. Kapı yalnızca kartla açılıyor. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: paketi alan o.","suspects":[{"id":"berna","name":"Berna","role":"Gişe memuru","statement":"17:55'te otoparka indim, arkadaşımı bekledim ve 18:20'de içeri döndüm. Kasa dairesine o gün hiç uğramadım."},{"id":"zafer","name":"Zafer","role":"Müdür yardımcısı","statement":"Sayımı 17:50'de bitirip kasa dairesini kilitledim. Sonra müdür odasından görüntülü toplantıya katıldım ve ayrılmadım."},{"id":"tuna","name":"Tuna","role":"Gişe memuru","statement":"Kapanıştan sonra gişemde günlük raporları yazdım. Kasa dairesine sayımdan sonra girmedim."},{"id":"mine","name":"Mine","role":"Güvenlik görevlisi","statement":"18:00'den itibaren giriş holündeydim. Nöbet yerimden ayrılmadım."}],"clues":[{"id":"kart","title":"Kart okuyucu kaydı","room":"Kasa dairesi","icon":"kayit","text":"17:42'de Zafer girmiş, 17:50'de çıkmış ve kapı kilitlenmiş. 18:03'te Gişe-2 kartıyla kapı açılmış, 18:05'te kapanmış. Gişe-2 kartı gün sonunda nöbetçi gişeciye devredilir; bugünkü devir defterinde Tuna yazılı.","fx":["implicate:tuna"]},{"id":"toplanti","title":"Görüntülü toplantı kaydı","room":"Müdür odası","icon":"kamera","text":"Zafer 17:55'ten 18:30'a kadar kamerada, bölge müdürüyle konuşuyor. Kayıtta tek bir kesinti yok.","fx":["clear:zafer"]},{"id":"turnike","title":"Otopark turnikesi","room":"Otopark","icon":"kamera","text":"Berna'nın kartı 17:55'te çıkış, 18:19'da giriş yapmış. Otopark kamerası bu sürede onu arkadaşıyla bir aracın yanında gösteriyor.","fx":["clear:berna"]},{"id":"nobet","title":"Nöbet defteri","room":"Giriş holü","icon":"defter","text":"18:00-18:10 arasında üç kurye teslimi var: 18:01, 18: 00'ten 16:00'ya kadar çıkış masasındaydım. Bu saatte dosya çıkmadı, defterde de yok."}],"clues":[{"id":"okut","title":"Barkod sistemi","room":"Arşiv deposu","icon":"kayit","text":"3318 numaralı dosya 15:32'de çıkış olarak okutulmuş. Okutma çıkış masası terminalinden yapılmış ve oturum Gülay'ın kimlik kartıyla açılmış; o gün terminalde başka oturum açılmamış.","fx":["implicate:gulay"]},{"id":"defter","title":"Çıkış defteri","room":"Çıkış masası","icon":"defter","text":"Son satır 15:10 tarihli: Dosya 2210 iade. Sonraki satır 16:05 tarihli. Arada hiç çıkış kaydı yok.","fx":["context"]},{"id":"taksi","title":"Taksi fişi","room":"Muhasebe","icon":"fis","text":"Kemal'in taksi fişi 14:40'ta şehir merkezinde biniş gösteriyor. Toplantı katılım listesinde 15:00-16:20 arası imzası var. Hastane kapı kartı 16:28'de okutulmuş.","fx":["clear:kemal"]},{"id":"muayene","title":"Muayene kayıtları","room":"Poliklinik","icon":"defter","text":"14:30'dan 16:15'e 11 hasta muayene edilmiş, en uzun ara 6 dakika. Arşiv iki kat aşağıda; asansörle gidiş dönüş yaklaşık 10 dakika sürer.","fx":["clear:baris"]},{"id":"sira","title":"Sıra numarası makinesi","room":"Kabul","icon":"kayit","text":"15:00-16:00 arasında 38 numara verilmiş, hepsi Sevim'in gişesine yazılmış. En uzun ara 3 dakika. Arşive gidiş dönüş 10 dakika sürer.","fx":["clear:sevim"]},{"id":"toz","title":"Raftaki iz","room":"Arşiv deposu","icon":"ayakizi","text":"3318 rafının tozunda mavi mürekkepli bir parmak izi var. Muhasebe ekibi mavi kalem kullanıyor. Raf tozu kalın; iz en az üç günlük.","fx":["decoy"]}],"solution":"gulay","valid":["okut","taksi","muayene","sira"],"explain":"Suçlu Gülay. Defterde 15:10-16:05 arası çıkış yok, ama barkod sistemi dosyayı 15:32'de çıkış masası terminalinden, Gülay'ın oturumuyla çıkış yapmış gösteriyor; Gülay hiç dosya çıkmadığını söylemişti. Kemal şehir merkezindeydi, Dr. Barış ile Sevim'in kayıtlarında arşive inip dönmeye yetecek boşluk yoktu. Mavi mürekkepli iz günlerce önceye aitti.","decoyNote":"Raftaki mavi iz en az üç günlüktü; dosya 15:00'te yerindeydi."},{"day":27,"level":"Zor","title":"Dolap 114","place":"Atlas Spor Merkezi","rooms":["Soyunma odası","Havuz","Resepsiyon","Kafeterya","Ağırlık salonu"],"hak":5,"rule":true,"mech":"alibi-saat","brief":"Atlas Spor Merkezi'nde üye Cem'in 114 numaralı dolabından cüzdan alındı. Dolap 19:10'da kilitlenmiş, 19:50'de açık bulundu. Dolaplar üye koduyla ya da personel kartıyla açılıyor. Dört kişinin ifadesi var ve yalnızca biri yalan söylüyor: cüzdanı alan o.","suspects":[{"id":"selin","name":"Selin","role":"Antrenör","statement":"19:00'dan 20:00'a kadar havuzda yüzme dersi verdim. Suyun başından hiç ayrılmadım."},{"id":"okan","name":"Okan","role":"Resepsiyon görevlisi","statement":"19:00'dan sonra girişte turnikeyi ve karşılamayı yürüttüm. Bankodan ayrılmadım."},{"id":"fadime","name":"Fadime","role":"Temizlik görevlisi","statement":"19:10'dan 19:50'ye kadar kafeteryanın camlarını ve zeminini temizledim. Soyunma odasına girmedim."},{"id":"riza","name":"Rıza","role":"Üye","statement":"19:05'ten 19:52'ye kadar ağırlık salonunda set çalıştım, sonra duşa girdim."}],"clues":[{"id":"havuz","title":"Havuz yoklaması","room":"Havuz","icon":"kayit","text":"İlk grup 19:00-19:25 arası derste, ikinci grup 19:55'te geliyor; arada havuz boş. Havuzdan soyunma koridoruna açılan kapıyı yalnızca personel kartı açar. Kapı kaydında 19:31'de açılış, 19:44'te geri dönüş var; kart türü: antrenör.","fx":["implicate:selin"]},{"id":"turnike","title":"Turnike onay kaydı","room":"Resepsiyon","icon":"kayit","text":"19:10-19:50 arasında 14 üye girişi Okan'ın kartıyla onaylanmış; en uzun ara 4 dakika. Soyunma odası resepsiyondan iki kat yukarıda, gidiş dönüş 8 dakika sürer.","fx":["clear:okan"]},{"id":"kafekam","title":"Kafeterya kamerası","room":"Kafeterya","icon":"kamera","text":"19:10-19:50 arasında Fadime sürekli kadrajda: cam silme, zemin paspası, çöp toplama. Kamera kafeteryanın tek çıkışını da izliyor.","fx":["clear:fadime"]},{"id":"cihaz","title":"Cihaz sayacı","room":"Ağırlık salonu","icon":"saat","text":"Cihazlar kartla çalışıyor. Rıza'nın kartı 19:05-19:52 arasında 9 set kaydetmiş; her set başlangıç ve bitişiyle kayıtlı, setler arası en uzun boşluk 5 dakika. Soyunma odası salondan 3 dakika uzakta; gidiş dönüş 6 dakika, dolabı açmak da en az 1 dakika.","fx":["clear:riza"]},{"id":"eldiven","title":"Dolap kapağı","room":"Soyunma odası","icon":"kilit","text":"Dolap 114'ün kapağında temizlik eldiveni lastiği izi var. İz kuru ve parmak izi etiketinin altında kalmış; etiket 19:10'da, dolap kilitlenirken yapıştırılmış.","fx":["decoy"]},{"id":"oturum","title":"Oturum kopukluğu","room":"Resepsiyon","icon":"saat","text":"Resepsiyon bilgisayarı 19:32'de Okan'ın oturumunu kapatmış, 19:33'te yeniden açmış. Bir dakikalık kopukluk var.","fx":["decoy"]}],"solution":"selin","valid":["havuz","turnike","kafekam","cihaz"],"explain":"Suçlu Selin. Dersi 19:00-20:00 boyunca sürdürdüğünü söyledi, oysa grup 19:25'te çıkmış ve havuz 19:55'e kadar boştu; antrenör kartıyla açılan havuz kapısı 19:31'de soyunma tarafına açılıp 19:44'te dönmüş. Okan, Fadime ve Rıza hırsızlık anında soyunma odasından uzaktaydı. Eldiven izi dolap kilitlenmeden önceye, tek dakikalık oturum kopukluğu da yolculuğa yetmeyecek kadar kısaydı.","decoyNote":"Eldiven izi 19:10'dan öncesine aitti; bir dakikalık kopukluk soyunmaya yetmezdi."},{"day":28,"level":"Orta","title":"Servis Modu","place":"Yaprak Kafe","rooms":["Bar","Depo","Bahçe","Ofis","Arka kapı"],"hak":4,"mech":"rol-uyusmazligi","brief":"Yaprak Kafe'de 08:40'taki deneme kahvesi güzeldi, ama 09:30'da ilk müşterilerin kahvesi yanık ve acı çıktı. Öğütücünün ayarı bozulmuş. Ayar yalnızca gizli servis menüsünden değiştirilebiliyor.","suspects":[{"id":"deniz","name":"Deniz","role":"Barista","statement":"08:40'ta ilk kahveyi çektim, sonra 09:30'a kadar arka depoda süt ve çekirdek sayımı yaptım."},{"id":"hakan","name":"Hakan","role":"Kasiyer","statement":"Kasayı açıp gün başı sayımını yaptım. Makinelere e     svg += "</g>";
    rects.forEach(function (r, i) {

      else if (r.y > 9) svg += '<rect x="' + (r.x + r.w * 0.5 - 11) + '" y="' + (r.y - 3) + '" width="22" height="6" fill="#0b1114"/>';

    });

  /* ---------- vaka nesnesi ---------- */
  function firstSentence(t) { var m = t.match(/^.*?[.!?](\s|$)/); var s = (m ? m[0] : t).trim(); return s.length > 150 ? s.slice(0, 147).replace(/\s+\S*$/, "") + "…" : s; }
  function makeCase(raw) {
    var zor = raw.level === "Zor", plan = buildPlan(raw, raw.day * 2 + (zor ? 1 : 0));
    return {

      scene: function () { return plan.svg; }, spots: plan.spots,
      teaser: raw.place + ". " + firstSentence(raw.brief),
      meta: [zor ? "~10 DAKİKA" : "~6 DAKİKA", raw.suspects.length + " ŞÜPHELİ", raw.hak + " HAK"],
      brief: raw.brief, suspects: raw.suspects,
      clues: raw.clues.map(function (c) { return { id: c.id, icon: ICONMAP[c.icon] || "file", title: c.title, room: c.room, hint: c.title + " incelenebilir.", text: c.text }; }),

  var BADGES = [

    { id: "uc-gece", icon: "ic-clock", name: "Üç Gece", desc: "3 gün seri yap" },

    { id: "otuz-gece", icon: "ic-clock", name: "Sekizinci Gece", desc: "30 gün seri yap" }

  var CASES = [], cur = null, state;
  function fresh() {
    state = { hak: cur.hak, examined: {}, marks: {}, status: {}, tab: "scene", wrong: 0 };

  }

  /* ---------- zaman: demoda "ertesi güne geç" ile 30 günü gezebilmek için kaydırılabilir ---------- */
  var DEVKEY = KEY + ".dev";
  function devOffset() { try { return parseInt(localStorage.getItem(DEVKEY), 10) || 0; } catch (e) { return 0; } }
  function setDevOffset(n) { try { if (n) localStorage.setItem(DEVKEY, String(n)); else localStorage.removeItem(DEVKEY); } catch (e) { /* storage unavailable */ } }
  function today() { var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + devOffset()); return d; }
  function dstr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function daysBetween(a, b) { var p = function (s) { var x = s.split("-"); return Date.UTC(+x[0], +x[1] - 1, +x[2]); }; return Math.round((p(b) - p(a)) / 864e5); }
  function yesterdayStr() { var d = today(); d.setDate(d.getDate() - 1); return dstr(d); }
  function weekKey(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), dn = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - dn + 3);

  }

  /* ---------- kayıt ---------- */
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* storage unavailable */ } }
  function dayOf(s) { s.days = s.days || {}; var t = dstr(today()); s.days[t] = s.days[t] || {}; return s.days[t]; }
  function dayNo(s) {
    if (!s.start) { s.start = dstr(today()); save(s); }
    return (Math.max(0, daysBetween(s.start, dstr(today()))) % TOTAL_DAYS) + 1;
  }
  function todaysCases(s) {
    var n = dayNo(s), out = DB.filter(function (c) { return c.day === n; });
    if (!out.length) out = DB.filter(function (c) { return c.day === 1; });
    out.sort(function (a, b) { return (a.level === "Zor") - (b.level === "Zor"); });
    return out.map(makeCase);
  }
  function currentStreak() {
    var s = load(); if (!s.last) return 0;

  }
  /* Haftada bir kez, kaçırılan tek günü video izleyerek geri alma */
  function restoreInfo() {
    var s = load(), t = dstr(today()), wk = weekKey(today());
    if (!s.last || !s.streak) return null;
    var used = s.restoreWeek === wk, gap = daysBetween(s.last, t);
    if (gap === 2) return { mode: "before", streak: s.streak, used: used };
    if (gap === 0 && s.broken && s.broken.date === yesterdayStr()) return { mode: "after", streak: s.broken.streak, used: used };
    return null;
  }
  function doRestore() {
    var s = load(), info = restoreInfo(); if (!info || info.used) return;
    if (info.mode === "before") { s.last = yesterdayStr(); s.streak = s.streak + 1; }

  }

    var s = load(), day = dayOf(s), res = { streak: s.streak || 0, fresh: [] };
    day[key] = { done: true, solved: solved, stars: stars };
    if (solved) {
      var t = dstr(today());
      if (s.last !== t) {
        var gap = s.last ? daysBetween(s.last, t) : null;
        if (gap === 1) s.streak = (s.streak || 0) + 1;
        else { s.broken = (gap === 2 && s.streak > 0) ? { streak: s.streak, date: yesterdayStr() } : null; s.streak = 1; }
        s.last = t;
      }
      var have = s.badges || [];
      var add = function (id) { if (have.indexOf(id) < 0) { have.push(id); res.fresh.push(id); } };
      add("ilk-dosya"); if (stars === 3) add("keskin-goz"); if (key === "zor") add("cetin-ceviz");
      if (s.streak >= 3) add("uc-gece"); if (s.streak >= 7) add("yedi-gece"); if (s.streak >= 30) add("otuz-gece");

    }

  }

  /* ---------- kapak ---------- */
  function starsMini(n) {

    for (var i = 0; i < 3; i++) h += '<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z" fill="' + (i < n ? "#dfc16a" : "none") + '" stroke="' + (i < n ? "#dfc16a" : "#2b373d") + '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    return h + "</span>";
  }
  function canPlay(day, key) { return !day.free || day.free === key || !!day.unlocked; }
  function renderRestore() {
    var info = restoreInfo(), box = $("#restoreBox");

    var lead = info.mode === "before"

      ? '<p class="muted">Bu haftaki hakkını kullandın. Yenisi pazartesi gelir.</p>'
      : '<p class="muted">Haftada bir kez, kısa bir video izleyerek dünü geri alabilirsin.</p><button class="btn amber" id="restoreBtn">Video izle ve seriyi kurtar</button>');
    var b = $("#restoreBtn"); if (b) b.onclick = function () { openVideo({ tag: "SERİ KURTARMA", title: "Serini kurtar", text: "Kısa videoyu izleyince dünkü gün çözülmüş sayılır ve serin devam eder.", go: "Serimi kurtar" }, function () { doRestore(); renderCover(); }); };
  }
  function renderCover() {

  $("#caseCards").addEventListener("click", function (e) {

  /* Video kapısı. Demoda 5 saniyelik sahte sayaç; Unity'de ödüllü video SDK'sı burada çağrılır. */

  function startCase(key) {

  /* ---------- sheets ---------- */

    openSheet('<h2>Suçlama</h2><fieldset><legend>KİM?</legend>' + sus + '</fieldset><fieldset><legend>EN GÜÇLÜ KANIT</legend>' + why + '</fieldset><p class="muted" style="font-size:13px">Her yanlış suçlama bir yıldız götürür.</p><div class="row"><button class="btn ghost" data-close>Vazgeç</button><button class="btn" id="doAccuse" disabled>Suçla</button></div>');
    var sheet = $("#sheet");
    var sync = function () { $("#doAccuse").disabled = !(sheet.querySelector('input[name="who"]:checked') && sheet.querySelector('input[name="why"]:checked')); };
    sheet.querySelectorAll("input").forEach(function (i) { i.onchange = sync; });
    $("#doAccuse").onclick = function () { verdict(sheet.querySelector('input[name="who"]:checked').value, sheet.querySelector('input[name="why"]:checked').value); };
  };

  function score(who, why) {
    if (who !== cur.solution) return { correct: false };
    var goodWhy = cur.valid.indexOf(why) >= 0, used = cur.hak - state.hak;
    var base = 1 + (goodWhy ? 1 : 0) + (used <= cur.starHak ? 1 : 0);
    return { correct: true, goodWhy: goodWhy, used: used, stars: Math.max(1, base - state.wrong) };
  }
  function starsSvg(n) {
    var h = '<div class="stars" aria-label="' + n + ' yıldız">';
    for (var i = 0; i < 3; i++) h += '<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z" fill="' + (i < n ? "#dfc16a" : "none") + '" stroke="' + (i < n ? "#dfc16a" : "#2b373d") + '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    return h + "</div>";
  }
  function verdict(who, why) {
    var r = score(who, why), name = cur.suspects.filter(function (s) { return s.id === who; })[0].name;
    if (!r.correct) {
      state.wrong++;
      openSheet('<p class="verdict bad">Yanlış suçlama</p><p>' + name + " bu işi yapmamış. İpuçlarını ve ifadeleri yeniden karşılaştır." + (cur.rule ? " Hatırla: yalan söyleyen tek kişi var." : "") + '</p><p class="muted">Kaybettiğin yıldız: ' + state.wrong + '</p><div class="row"><button class="btn ghost" id="giveUp">Vazgeç ve çözümü gör</button><button class="btn" id="goOn">Devam et</button></div>');
      $("#goOn").onclick = closeSheet;
      $("#giveUp").onclick = function () {
        recordDone(cur.key, false, 0);
        openSheet('<p class="verdict bad">Dosya kapandı</p><div class="solution">' + cur.explain + '</div><p class="muted">Bu vaka bugün bir daha oynanamaz.</p><button class="btn" id="back">Vakalara dön</button>');
        $("#back").onclick = backToCover;
      };
      return;
    }
    var rec = recordDone(cur.key, true, r.stars);
    var note = r.goodWhy ? "" : '<p class="muted">Doğru kişiyi buldun ama seçtiğin kanıt onu göstermiyor: ' + cur.decoyNote + ".</p>";
    var bd = rec.fresh.map(function (id) { var b = BADGES.filter(function (x) { return x.id === id; })[0]; return '<p class="newbadge">Yeni mühür: ' + b.name + "</p>"; }).join("");
    openSheet('<p class="verdict ok">Dosya kapandı</p>' + starsSvg(r.stars) + '<div class="solution">' + cur.explain + "</div>" + note +
      '<div class="streak"><b>' + rec.streak + '</b><span class="muted">gün serisi</span></div>' + bd +
      '<p class="muted">Bu vakada ' + r.used + " ipucu hakkı kullandın. Yeni dosyalar gece yarısı, 00:00'da gelir.</p>" +
      '<button class="btn" id="back">Vakalara dön</button>');
    $("#back").onclick = backToCover;
  }
  function backToCover() { closeSheet(); $("#app").hidden = true; $("#cover").hidden = false; renderCover(); }

  renderCover();
})();
</script>

<script>
/* Section-only ambient loop: generated with WebAudio, starts after the first tap. */
(function () {
  var btn = document.getElementById("sndBtn"), PREF = "sekizincigece.vakadosyasi.sound";
  var wanted = true, ctx = null, master = null, timer = null, step = 0, nextT = 0;
  try { if (localStorage.getItem(PREF) === "off") wanted = false; } catch (e) {}
  function paint() { btn.setAttribute("aria-pressed", wanted ? "true" : "false"); }
  paint();
  var BPM = 44, BEAT = 60 / BPM;
  var CH = [
    { root: 33, notes: [45, 48, 52, 55] },  /* Am7, derin */
    { root: 29, notes: [41, 44, 48, 53] },  /* Fm(maj) gölgesi */
    { root: 31, notes: [43, 46, 50, 53] },  /* Gm7 */
    { root: 28, notes: [40, 43, 47, 50] }   /* Em7 */
  ];
  var PENTA = [69, 72, 76, 79];
  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function setup() {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 0.4;
    var dl = ctx.createDelay(1.5); dl.delayTime.value = BEAT * 0.75;
    var fb = ctx.createGain(); fb.gain.value = 0.32;
    var wet = ctx.createGain(); wet.gain.value = 0.35;
    dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(lp);
    master.connect(lp); master.connect(dl); lp.connect(ctx.destination);
    return true;
  }
  function tone(type, f, t, dur, vol, atk, dest) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function bar(i, t) {
    var c = CH[i % CH.length], len = BEAT * 4;
    c.notes.forEach(function (n, k) {
      tone("sawtooth", hz(n) * 1.002, t, len * 1.15, 0.018, 1.2, master);
      tone("sine", hz(n) * 0.998, t, len * 1.15, 0.035, 1.4, master);
    });
    tone("sine", hz(c.root), t, BEAT * 3.4, 0.16, 0.05, master);
    for (var b = 0; b < 8; b++) {
      if (Math.random() < 0.14) {
        var n = PENTA[Math.floor(Math.random() * PENTA.length)];
        tone("sine", hz(n), t + b * BEAT / 2 + (Math.random() * 0.03), BEAT * 1.6, 0.06, 0.01, master);
      }
    }
  }
  function tick() {
    while (nextT < ctx.currentTime + 1.2) { bar(step, Math.max(nextT, ctx.currentTime + 0.05)); step++; nextT += BEAT * 4; }
  }
  function start() {
    if (!wanted) return;
    if (!ctx && !setup()) return;
    if (ctx.state === "suspended") ctx.resume();
    if (timer) return;
    nextT = ctx.currentTime + 0.1; step = 0;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 2.5);
    tick(); timer = setInterval(tick, 400);
  }
  function stop() {
    if (!ctx || !timer) return;
    clearInterval(timer); timer = null;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
  }
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    wanted = !wanted; paint();
    try { localStorage.setItem(PREF, wanted ? "on" : "off"); } catch (x) {}
    if (wanted) start(); else stop();
  });
  document.addEventListener("pointerdown", function first() {
    document.removeEventListener("pointerdown", first, true);
    start();
  }, true);
  document.addEventListener("visibilitychange", function () {
    if (!ctx) return;
    if (document.hidden) { if (timer) { clearInterval(timer); timer = null; } ctx.suspend(); }
    else if (wanted) { ctx.resume(); if (!timer) { nextT = ctx.currentTime + 0.1; timer = setInterval(tick, 400); tick(); } }
  });
  window.__vakaAudio = { start: start, stop: stop };
})();
</script>
